<!doctype html>
<html lang="be">
<head><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; object-src 'none'; base-uri 'none'; connect-src 'self'; form-action 'none'; frame-src 'self'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Літара І і · Топоух · Топоух 2</title>
<style>
:root{--bg:#f1f8f3;--ink:#182539;--muted:#425367;--green:#175c44;--lime:#deedb5;--white:#fff;--violet:#4826ab;--line:#ccd8d1;--wrong:#842b3a;font:18px/1.45 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,42px)}main,header{max-width:920px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-weight:700;color:var(--green)}header p{margin:0}.progress{margin-bottom:17px;display:flex;align-items:center;gap:14px;font-size:.82rem;font-weight:700}.progress progress{flex:1;height:12px;accent-color:var(--green);max-width:550px}#step{display:grid;grid-template-columns:170px minmax(0,1fr);gap:23px;padding:clamp(20px,4vw,37px);min-height:450px;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:0 9px 27px #315d4721}.mascot{width:100%;height:auto;max-width:170px;align-self:start;padding:10px;border-radius:17px;background:#ebf3d8}.kicker{color:var(--green);font-weight:800;letter-spacing:.065em;text-transform:uppercase;font-size:.75rem;margin:0 0 6px}h1{font-size:clamp(1.65rem,4vw,2.6rem);margin:0 0 10px;line-height:1.12;letter-spacing:-.035em}h1:focus{outline:none}#instruction{margin:0 0 18px;color:var(--muted)}.cards,.options{display:flex;gap:10px;flex-wrap:wrap}.letter,.word{font-size:2rem;font-weight:850;color:var(--green);padding:2px 14px;background:#eaf2d9;border-radius:9px}.word{font-size:1.47rem}mark{background:#fff0a8;color:#273628;border-radius:4px;padding:0 2px}.illustration{height:63px;width:74px;display:inline-block;vertical-align:middle;margin:0 8px 0 0}.sample{margin:0 0 12px;font-size:1.3rem;font-weight:700}.sample kbd{font:inherit}button{min-height:48px;min-width:46px;padding:8px 17px;border:2px solid transparent;border-radius:10px;font:700 1rem/1.2 system-ui,sans-serif;cursor:pointer}button:focus-visible{outline:3px solid #344bb0;outline-offset:3px}.choice{background:#edf5f3;border-color:#c2d7ce;color:var(--ink)}.choice:hover:not([aria-disabled]){background:#deece7}.choice[aria-pressed=true]{border-color:var(--violet);color:var(--violet);background:#f1ebff}.choice[aria-disabled=true]{cursor:default}.choice.correct{border-color:var(--green);background:#e7f3d1;color:var(--green)}.choice.incorrect{border-color:var(--wrong);background:#fff0f1;color:var(--wrong)}.primary{color:#fff;background:var(--violet)}.secondary{color:var(--green);background:#e8f1e8}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-height:48px;margin-top:12px}.feedback{min-height:4.25em;margin:12px 0 0;color:var(--green);font-weight:700}.feedback[data-wrong]{color:var(--wrong)}.note{font-size:.81rem;color:var(--muted);margin-top:16px}button[hidden],div[hidden],p[hidden]{display:none!important}.empty{display:inline-block;min-width:.9em;text-align:center;color:var(--violet)}
@media(max-width:620px){#step{grid-template-columns:1fr;padding:18px;min-height:0;gap:12px}.mascot{width:92px;padding:5px}.progress{margin-bottom:12px}header{font-size:.86rem}.feedback{min-height:3.7em}.actions{margin-bottom:5px}}@media(prefers-reduced-motion:no-preference){.choice{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<header><p>Топоух · Пробныя заняткі</p><p>Беларуская мова · 2 клас</p><a href="index.html" style="color:inherit;padding:.45em;border-radius:.4em">У клуб</a></header>
<main>
<div class="progress"><progress id="progress" max="9" value="1" aria-label="Ход заняткаў"></progress><span id="count"></span></div>
<section id="step" aria-labelledby="title">
<svg class="mascot" viewBox="0 0 96 96" role="img" aria-label="Сава Ух">
 <path fill="#1386a0" d="M19 23 16 12q10 1 20 10 15-5 26 1 9-8 19-8l-4 18a36 36 0 0 1 5 22c0 23-15 33-36 33S12 78 12 57q-1-18 7-34Z"/>
 <path fill="#65c8d9" d="M9 51q2-10 12-13l4 28Q14 74 9 64c-2-4-2-10 0-13Z"/>
 <ellipse cx="49" cy="71" rx="22" ry="13" fill="#8bd9e4"/>
 <ellipse cx="35" cy="44" rx="15" ry="17" fill="#fff7dd"/><ellipse cx="62" cy="42" rx="14" ry="16" fill="#fff7dd"/>
 <circle cx="38" cy="45" r="6" fill="#172b3f"/><circle cx="65" cy="43" r="6" fill="#172b3f"/><circle cx="40" cy="43" r="1.5" fill="#fff"/><circle cx="67" cy="41" r="1.5" fill="#fff"/>
 <path fill="#efa940" d="M43 53q6-5 12-1l-6 9zM30 84h10l-4 9h-9zm25 0h10l2 9H55z"/>
 <path d="m41 74 4 4m8-6 4 4" fill="none" stroke="#3aa4b8" stroke-width="2.4" stroke-linecap="round"/>
</svg>
<div>
<p class="kicker" id="category"></p><h1 id="title" tabindex="-1"></h1>
<p id="instruction"></p><div id="sample"></div>
<div id="options" class="options" aria-label="Варыянты адказу"></div>
<p id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
<div class="actions"><button id="prev" class="secondary" hidden>Назад</button><button id="next" class="primary" hidden>Далей</button></div>
</div>
</section>
<p class="note">Tab — пераход паміж кнопкамі; Enter ці прабел — выбар. Вынікі нідзе не захоўваюцца.</p>
</main>
<script>
'use strict';
const art={
 needle:'<path d="M16 45 61 12" stroke="#405873" stroke-width="5" stroke-linecap="round"/><ellipse cx="61" cy="12" rx="6" ry="3" transform="rotate(-36 61 12)" fill="none" stroke="#405873" stroke-width="3"/><path d="M65 15q14 11 1 25-15 17-33 8" stroke="#9c5970" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
 fox:'<path d="M15 17 34 24 56 18 58 36 37 51 15 32Z" fill="#ce6b38"/><path d="M17 21 30 30 22 35Z M55 22 49 36 43 30Z" fill="#edb179"/><path d="M23 35q11 0 14 11 8-10 20-11L37 51Z" fill="#fff2da"/><circle cx="29" cy="35" r="2" fill="#34283b"/><circle cx="46" cy="34" r="2" fill="#34283b"/><circle cx="37" cy="45" r="3" fill="#34283b"/>',
 leaf:'<path d="M16 40Q16 16 60 9 54 45 26 47Z" fill="#4c9d65"/><path d="M11 52 52 17M28 38l-1-10m12 2 10 1" stroke="#235e42" stroke-width="3" fill="none" stroke-linecap="round"/>',
 book:'<path d="M9 17q13-5 27 6 16-9 28-6v31q-13-4-28 5-14-8-27-5Z" fill="#5840a8"/><path d="M15 21q10-3 21 5 13-8 22-5v22q-12-3-22 5-11-7-21-5Z" fill="#fff4c7"/><path d="M36 25v21" stroke="#a58147" stroke-width="2"/>',
 window:'<rect x="14" y="10" width="45" height="43" rx="4" fill="#415c73"/><rect x="19" y="15" width="35" height="33" fill="#b6dded"/><path d="M36.5 15v33M19 31h35" stroke="#415c73" stroke-width="3"/><rect x="10" y="51" width="53" height="5" rx="2" fill="#a07853"/>',
 bowl:'<path d="M9 28h56q-4 22-22 24H30Q13 50 9 28Z" fill="#b15d45"/><ellipse cx="37" cy="28" rx="28" ry="8" fill="#d99070"/><ellipse cx="37" cy="28" rx="23" ry="5" fill="#f1b79c"/><path d="M17 40q19 8 40 0" stroke="#efad85" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
};
const icon=(name)=>'<svg class="illustration" viewBox="0 0 74 64" aria-hidden="true">'+art[name]+'</svg>';
const steps=[
 {phase:'Знаёмства',title:'Пазнаёмімся з літарай І і',instruction:'Ух знайшла ў словах літару І. Паглядзі на вялікую і малую літару.',sample:'<div class="cards"><span class="letter">І</span><span class="letter">і</span></div><p class="sample">'+icon('needle')+'<mark>і</mark>голка</p><p class="sample">'+icon('fox')+'л<mark>і</mark>са</p>',hint:'У слове «іголка» літара і ў пачатку, а ў слове «ліса» яна ў сярэдзіне.',next:'Пачаць'},
 {phase:'Разам з Ух',title:'Знайдзі вялікую літару І',instruction:'Выберы адну літару.',options:['Л','І','Т'],correct:1,hint:'У вялікай І няма нахіленых ліній. Параўнай з узорам:',sample:'<p class="sample"><span class="letter">І</span></p>'},
 {phase:'Разам з Ух',title:'Знайдзі малую літару і',instruction:'Выберы малую літару да вялікай І.',options:['л','т','і'],correct:2,hint:'Малая і мае кропку зверху.',sample:'<p class="sample"><span class="letter">І</span> → ?</p>'},
 {phase:'Патрэніруемся',title:'Дзе літара і ў слове «ліст»?',instruction:'Націсні на патрэбную літару.',options:['л','і','с','т'],correct:1,hint:'І стаіць паміж л і с.',sample:'<p class="sample">'+icon('leaf')+'ліст</p>'},
 {phase:'Патрэніруемся',title:'Дапоўні слова',instruction:'Пад малюнкам прапушчана адна літара. Якая?',options:['і','а','о'],correct:0,hint:'На малюнку кніга. Устаў і пасля н.',sample:'<p class="sample">'+icon('book')+'кн<span class="empty" aria-label="пропуск">_</span>га</p>'},
 {phase:'Патрэніруемся',title:'У пачатку ці ў сярэдзіне?',instruction:'Выберы, дзе стаіць і ў слове «іголка».',options:['У сярэдзіне','У пачатку','У канцы'],correct:1,hint:'Прачытай слова злева направа. Першая літара — і.',sample:'<p class="sample">'+icon('needle')+'іголка</p>'},
 {phase:'Правер сябе · 1 з 2',title:'Знайдзі слова з літарай і',instruction:'Выберы слова, у якім бачыш малую літару і.',options:['дом','лук','вікно'],correct:2,hint:'Параўнай тры словы. Кропка ёсць над і ў слове «вікно».',check:true},
 {phase:'Правер сябе · 2 з 2',title:'Дапоўні новае слова',instruction:'Устаў патрэбную літару.',options:['е','і','а'],correct:1,hint:'На малюнку міска. Устаў і пасля м.',sample:'<p class="sample">'+icon('bowl')+'м<span class="empty" aria-label="пропуск">_</span>ска</p>',check:true},
 {phase:'Гатова',title:'Заняткі скончаны!',instruction:'Цяпер ты ведаеш вялікую І і малую і.',sample:'<div class="cards"><span class="letter">І</span><span class="letter">і</span></div>',next:'Прайсці яшчэ раз'}
];
const $=id=>document.getElementById(id);let cur=0,answers={},attempts={},firstCheck={};
function present(focus){
 const s=steps[cur];$('progress').value=cur+1;$('count').textContent=(cur+1)+' / '+steps.length;
 $('category').textContent=s.phase;$('title').textContent=s.title;$('instruction').textContent=s.instruction;$('sample').innerHTML=s.sample||'';
 $('options').replaceChildren();$('feedback').removeAttribute('data-wrong');$('feedback').textContent=s.options?'':(s.hint||'');
 $('prev').hidden=cur===0;$('next').hidden=Boolean(s.options&&answers[cur]!==s.correct);
 $('next').textContent=s.next||'Далей';
 if(s.options) s.options.forEach((label,i)=>{
   const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=label;b.setAttribute('aria-pressed','false');
   if(answers[cur]===s.correct){b.setAttribute('aria-disabled','true');if(i===s.correct){b.setAttribute('aria-pressed','true');b.classList.add('correct');}}
   b.addEventListener('click',()=>answer(i,b));$('options').append(b);
 });
 if(s.options&&answers[cur]===s.correct)$('feedback').textContent='Правільна!';
 if(cur===steps.length-1){
   const n=Object.values(firstCheck).filter(Boolean).length;
   $('feedback').textContent=n===2?'Абодва заданні ў самаправерцы атрымаліся з першай спробы.':'Самаправерка: з першай спробы атрымалася '+n+' з 2. Цяпер абодва заданні выкананыя.';
 }
 if(focus)$('title').focus();
}
function answer(i,b){
 const s=steps[cur];if(answers[cur]===s.correct)return;
 attempts[cur]=(attempts[cur]||0)+1;
 if(s.check&&attempts[cur]===1)firstCheck[cur]=i===s.correct;
 for(const a of $('options').children){a.classList.remove('incorrect');a.setAttribute('aria-pressed','false');}
 b.setAttribute('aria-pressed','true');
 if(i===s.correct){
   answers[cur]=i;b.classList.add('correct');$('feedback').removeAttribute('data-wrong');$('feedback').textContent='Правільна!';
   for(const a of $('options').children)a.setAttribute('aria-disabled','true');$('next').hidden=false;
 }else{
   b.classList.add('incorrect');$('feedback').setAttribute('data-wrong','');$('feedback').textContent=(s.check&&attempts[cur]===1)?'Паспрабуй яшчэ раз.':s.hint+' Паспрабуй яшчэ раз.';
 }
}
$('next').addEventListener('click',()=>{if(cur===steps.length-1){cur=0;answers={};attempts={};firstCheck={};}else{cur++;}present(true);});
$('prev').addEventListener('click',()=>{if(cur>0){cur--;present(true);}});
present(false);
</script>
</body></html>
