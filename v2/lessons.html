омпозицию по описанию и выбери решение для рисунка.","steps":[{"prompt":"Один высокий подсолнух должен заполнить лист от стебля до цветка. Какой формат удобнее?","choices":["Очень широкий горизонтальный","Только квадрат","Узкий вертикальный"],"answer":2,"feedback":["Проверь условие. Сверь ответ с деталями задания.","Попробуй ещё. Одна деталь может полностью изменить ответ.","Верно: Узкий вертикальный."]},{"prompt":"Перед новым заданием найди полезный способ проверки. Что поможет решить именно такую задачу?","choices":["Формат и размер главного объекта решают разные задачи.","Всегда выбирай самый яркий вариант, не читая задачу.","Положи все детали в середину, какой бы ни была задача."],"answer":0,"feedback":["Верно. Этот способ помогает проверить ответ по условию, а не угадывать.","Посмотри ещё раз. Этот способ помогает проверить ответ по условию, а не угадывать.","Сверься с заданием. Этот способ помогает проверить ответ по условию, а не угадывать."]},{"prompt":"На листе будет высокая башня с флажком. Вокруг неё не нужен длинный городской пейзаж. Как повернуть прямоугольный лист?","choices":["Горизонтально","Вертикально","Направление не влияет на место для башни"],"answer":1,"feedback":["Проверь условие. В условии есть подсказка, которая подтверждает этот выбор.","Верно: Вертикально.","Попробуй ещё. В условии есть подсказка, которая подтверждает этот выбор."]},{"prompt":"На листе будет высокая башня с флажком. Вокруг неё не нужен длинный городской пейзаж. Как сделать башню главной?","choices":["Спрятать башню за большими домами","Добавить в каждый угол по крупной башне","Показать её крупно и оставить вокруг немного места"],"answer":2,"feedback":["Посмотри ещё раз. Этот ответ точнее учитывает условие.","Сверься с заданием. Этот ответ точнее учитывает условие.","Верно: Показать её крупно и оставить вокруг немного места."]}]}]},{"id":"en","title":"Английский с Топой","lessons":[{"id":"en-01","title":"Остров Привет · Разминка","goal":"Вспомнить приветствия, числа и названия игрушек.","source":"Кругосветка Топы · Повторение существующей темы.","intro":"Топа ждёт на причале с коробкой игрушек. Поздоровайся и помоги собрать вещи.","steps":[{"prompt":"Топа говорит «Hello!». Как ответить при встрече?","choices":["Goodbye!","Hi!","A ball."],"answer":1,"feedback":["Goodbye говорят при прощании, а Топа только что пришёл.","Hi! Это короткое дружеское приветствие.","A ball — мяч. При встрече нужно поздороваться."]},{"prompt":"На причале пять кубиков: ■ ■ ■ ■ ■. Как сказать «пять»?","choices":["Four","Six","Five"],"answer":2,"feedback":["Four — четыре. После four идёт five.","Six — шесть, то есть на один кубик больше.","Five — пять. One, two, three, four, five."]},{"prompt":"В коробке мишка, мяч и поезд. Что Топа просит словами «a teddy bear»?","choices":["Плюшевого мишку","Мяч","Игрушечный поезд"],"answer":0,"feedback":["A teddy bear — плюшевый мишка. Ещё можно сказать a teddy.","Мяч — a ball. Teddy bear — название игрушки-зверька.","Поезд — a train. Teddy bear — плюшевый мишка."]},{"prompt":"Топа спрашивает «How many balls?». В коробке два мяча. Что ответить?","choices":["A teddy bear.","Two balls.","Hello!"],"answer":1,"feedback":["Это название мишки, а вопрос просит сосчитать мячи.","Two balls — два мяча. После two обычно нужна форма во множественном числе.","Hello — приветствие. How many? значит «Сколько?»."]}],"pass":3},{"id":"en-02","title":"Снежный остров · Повторение","goal":"Связать зимнюю погоду и одежду.","source":"Кругосветка Топы · Повторение существующей темы.","intro":"На острове снег. Помоги Топе одеться и скажи, какая за окном погода.","steps":[{"prompt":"Топе холодно без обуви. Он собирается идти по снегу. Что надеть на ноги?","choices":["A hat","A teddy bear","Boots"],"answer":2,"feedback":["A hat надевают на голову. Топа ищет обувь.","A teddy bear — игрушка, она не согреет ноги.","Boots — сапоги. Их надевают на ноги."]},{"prompt":"Топа говорит «I have got a scarf». Что у него есть?","choices":["Шарф","Шапка","Пальто"],"answer":0,"feedback":["A scarf — шарф. Топа может обмотать его вокруг шеи.","Шапка — a hat. A scarf носят вокруг шеи.","Пальто — a coat. A scarf — шарф."]},{"prompt":"С неба падают снежинки. Как описать погоду?","choices":["It’s rainy.","It’s snowy.","It’s sunny."],"answer":1,"feedback":["Rainy — дождливо. Здесь падает снег, а не дождь.","It’s snowy — снежно. В слове snowy слышится snow, «снег».","Sunny — солнечно. Здесь нужно назвать погоду со снегом."]},{"prompt":"Как попросить Топу надеть шапку?","choices":["I like your hat.","Put on your coat!","Put on your hat!"],"answer":2,"feedback":["Это значит «Мне нравится твоя шапка», а не просьба надеть её.","Put on — надень, но coat — пальто. Уточни вещь.","Put on your hat! — «Надень шапку!»."]}],"pass":3},{"id":"en-03","title":"Остров Домик · 1. Где мы?","goal":"Узнать три комнаты: kitchen, bedroom, living room.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо новой остановки. Топа приглашает в дом. На каждой двери написано название комнаты.","steps":[{"prompt":"Здесь стоят плита и холодильник. Как называется комната?","choices":["Kitchen","Bedroom","Living room"],"answer":0,"feedback":["Kitchen — кухня. Здесь готовят еду.","Bedroom — спальня. Ищи комнату, где готовят.","Living room — гостиная. Плита и холодильник обычно на кухне."]},{"prompt":"За дверью кровать и подушка. Какую дверь открыть?","choices":["Living room","Bedroom","Kitchen"],"answer":1,"feedback":["Living room — гостиная. Спальню выдаёт кровать.","Bedroom — спальня. Bed значит «кровать».","Kitchen — кухня. Кровать и подушка обычно в другой комнате."]},{"prompt":"Топа ждёт на диване, рядом телевизор. Где он?","choices":["Bedroom","Kitchen","Living room"],"answer":2,"feedback":["Bedroom — спальня. Диван и телевизор здесь обозначают гостиную.","Kitchen — кухня. Здесь речь не о приготовлении еды.","Living room — гостиная: комната, где семья может отдыхать вместе."]},{"prompt":"Топа говорит «This is the kitchen». Куда он тебя привёл?","choices":["В гостиную","На кухню","В спальню"],"answer":1,"feedback":["Гостиная — living room. Топа сказал kitchen.","This is the kitchen — «Это кухня».","Спальня — bedroom. Слово kitchen означает «кухня»."]}],"pass":3},{"id":"en-04","title":"Остров Домик · 2. Гостиная Топы","goal":"Отличать chair, table и box.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо новой остановки. Помоги Топе подписать мебель и коробку.","steps":[{"prompt":"У этого предмета есть спинка. На него можно сесть. Какую подпись выбрать?","choices":["A table","A box","A chair"],"answer":2,"feedback":["Table — стол. На стуле есть спинка, у стола её нет.","Box — коробка. В неё складывают вещи.","Chair — стул. На него можно сесть."]},{"prompt":"Топа ставит чашку на предмет со столешницей. Что подписать?","choices":["A table","A chair","A box"],"answer":0,"feedback":["Table — стол. Чашку ставят на столешницу.","Chair — стул. Он для того, чтобы сидеть.","Box — коробка. В неё можно положить вещь, но здесь речь о столешнице."]},{"prompt":"Топа складывает игрушки в картонную коробку. Как подписать её?","choices":["A chair","A box","A table"],"answer":1,"feedback":["Chair — стул. Игрушки собирают в коробку.","Box — коробка. В неё помещаются игрушки.","Table — стол. В данном случае нужен предмет, внутрь которого можно что-то положить."]},{"prompt":"На карточке написано «a chair and a table». Что поставить рядом?","choices":["Коробку и стол","Стул и коробку","Стул и стол"],"answer":2,"feedback":["Box — коробка, а её нет на карточке.","Первый предмет выбран верно. Второй — table, стол.","Chair and table — стул и стол. And соединяет два предмета."]}],"pass":3},{"id":"en-05","title":"Остров Домик · 3. Где игрушка?","goal":"Различать in, on и under.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо новой остановки. Топа прячет мишку: внутри коробки — in, на поверхности — on, ниже предмета — under.","steps":[{"prompt":"Мишка лежит внутри коробки. Вставь слово: The teddy is ___ the box.","choices":["In","On","Under"],"answer":0,"feedback":["In значит «внутри». Мишка помещён в коробку.","On значит «на». Здесь мишка не на крышке, а внутри.","Under значит «под». Здесь мишка не под коробкой."]},{"prompt":"Мишка сидит на стуле. Вставь слово: The teddy is ___ the chair.","choices":["Under","On","In"],"answer":1,"feedback":["Under — под стулом, не на сиденье.","On — на поверхности. Мишка сидит на стуле.","In — внутри. Мишка сидит на сиденье."]},{"prompt":"Мишка спрятался под стулом. Как сказать?","choices":["The teddy is in the box.","The teddy is on the chair.","The teddy is under the chair."],"answer":2,"feedback":["Так мишка был бы в коробке. Найди chair и слово «под».","On the chair — на стуле, а мишка под ним.","Under the chair — под стулом."]},{"prompt":"Мяч лежит на столе. Как сказать?","choices":["The ball is under the table.","The ball is on the table.","The ball is in the box."],"answer":1,"feedback":["Under the table — под столом. Мяч лежит сверху.","On the table — на столе.","In the box — внутри коробки. Мяч на столе, а не в коробке."]}],"pass":3},{"id":"en-06","title":"Остров Домик · Проверка недели","goal":"Самостоятельно выбрать предмет, предлог и порядок слов.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо проверки, не экзамен. Используй подсказку только после ответа.","steps":[{"prompt":"Топа ищет кровать. На какой двери она находится?","choices":["Kitchen","Living room","Bedroom"],"answer":2,"feedback":["Kitchen — кухня. Кровать обычно в спальне.","Living room — гостиная. В этом домике кровать в спальне.","Bedroom — спальня, где находится кровать."]},{"prompt":"Игрушка-машинка стоит внутри коробки. Как сказать?","choices":["The car is in the box.","The car is on the table.","The car is under the box."],"answer":0,"feedback":["The car is in the box — «Машинка в коробке».","On the table — на столе. Машинка стоит в коробке.","Under the box — под коробкой, не внутри неё."]},{"prompt":"Прочитай: «The teddy is under the table». Где искать мишку?","choices":["На стуле","Под столом","В коробке"],"answer":1,"feedback":["The table — стол, а chair — стул. Under значит «под».","Under the table — под столом.","В коробке было бы in the box. Здесь сказано under the table."]},{"prompt":"Выбери правильный порядок слов: «Мяч на стуле».","choices":["Is the ball on the chair?","The chair is on the ball.","The ball is on the chair."],"answer":2,"feedback":["Так получается вопрос. Для утверждения начинаем с The ball.","Здесь стул оказался на мяче. Мяч должен стоять первым.","The ball → is → on the chair. Сначала кто или что, потом где."]}],"pass":3},{"id":"en-07","title":"Вкусный остров · Попробуй меню","goal":"Назвать фрукты и сказать, что нравится.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо будущего острова. В кафе Топы есть фрукты. Помоги сделать заказ.","steps":[{"prompt":"На тарелке два яблока. Какая надпись подойдёт?","choices":["Apples","Bananas","Carrots"],"answer":0,"feedback":["Apples — яблоки. Одно яблоко — an apple.","Bananas — бананы. На тарелке яблоки.","Carrots — морковь. Здесь нужны яблоки."]},{"prompt":"Как сказать «Мне нравятся бананы»?","choices":["I have got apples.","I like bananas.","I like apples."],"answer":1,"feedback":["Это «У меня есть яблоки», а надо сказать, что нравится.","I like bananas — «Мне нравятся бананы».","Фраза I like правильная, но apples — яблоки."]},{"prompt":"Как вежливо попросить яблоко в кафе?","choices":["Goodbye!","I am an apple.","An apple, please."],"answer":2,"feedback":["Goodbye говорят, когда уходят. Сейчас нужно попросить яблоко.","Так получилось «Я — яблоко». Для просьбы пригодится please.","An apple, please — «Яблоко, пожалуйста»."]},{"prompt":"Прочитай: «I like pears». Что нравится Топе?","choices":["Яблоки","Груши","Бананы"],"answer":1,"feedback":["Яблоки — apples, а pears — другой фрукт.","Pears — груши. I like — «мне нравится» или «мне нравятся».","Бананы — bananas. Топа сказал pears."]}],"pass":3},{"id":"en-08","title":"Остров Зверей · Кто что умеет?","goal":"Называть животных и говорить, что они умеют.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо будущего острова. Топа наблюдает за животными. Слово can значит «умеет» или «может».","steps":[{"prompt":"На карточке плывёт медведь. Как сказать «Медведь умеет плавать»?","choices":["A bird can swim.","A bear can fly.","A bear can swim."],"answer":2,"feedback":["Bird — птица, а на карточке медведь.","Bear — медведь, верно. Но fly означает «летать».","A bear can swim — «Медведь умеет плавать»."]},{"prompt":"На картинке воробей летит над веткой. Что он умеет?","choices":["It can fly.","It can read.","It can swim."],"answer":0,"feedback":["It can fly — «Он умеет летать».","Read — читать. На картинке воробей летит.","Swim — плавать. Над веткой воробей летит, не плывёт."]},{"prompt":"Прочитай «A frog can jump». Кто умеет прыгать?","choices":["Медведь","Лягушка","Птица"],"answer":1,"feedback":["Медведь — bear. В предложении есть frog.","Frog — лягушка, jump — прыгать.","Птица — bird. Здесь речь о лягушке."]},{"prompt":"Как закончить предложение про рыбу в воде: «A fish can ___»?","choices":["Swims","To swim","Swim"],"answer":2,"feedback":["После can здесь нужна простая форма без -s.","После can слово to не нужно: can swim.","Can swim — «умеет плавать». После can — простая форма глагола."]}],"pass":3},{"id":"en-09","title":"Остров Школа · Перед уроками","goal":"Узнать школьные предметы и порядок дней недели.","source":"Кругосветка Топы · Новая остановка, демо.","intro":"Демо будущего острова. Собери рюкзак Топы и посмотри на расписание.","steps":[{"prompt":"Топа говорит «I need a pencil». Что дать ему?","choices":["Карандаш","Линейку","Книгу"],"answer":0,"feedback":["A pencil — карандаш. I need — «мне нужно».","Линейка — a ruler. Топа просит pencil.","Книга — a book. Здесь нужен предмет, которым пишут."]},{"prompt":"На карточке написано «a ruler». Какой предмет положить в рюкзак?","choices":["Книгу","Линейку","Карандаш"],"answer":1,"feedback":["Книга — a book. A ruler нужен, чтобы проводить прямые линии.","A ruler — линейка. Ею отмеряют длину.","Карандаш — a pencil. На карточке a ruler."]},{"prompt":"Какой день идёт после Monday?","choices":["Sunday","Friday","Tuesday"],"answer":2,"feedback":["Sunday — воскресенье, оно перед Monday.","Friday — пятница, она ближе к концу учебной недели.","Tuesday — вторник, день после Monday."]},{"prompt":"Прочитай: «I need a pencil and a book». Что положить в рюкзак?","choices":["Линейку и книгу","Карандаш и книгу","Карандаш и линейку"],"answer":1,"feedback":["Book — книга. Pencil — карандаш, а не линейка.","Pencil and book — карандаш и книга.","Первый предмет верный. Второй — book, книга."]}],"pass":3},{"id":"en-10","title":"Поздороваться и попрощаться","goal":"Узнать разные реплики начала и конца встречи.","intro":"Сначала попробуй два задания. Потом проверь, получится ли применить тот же приём в новой ситуации.","steps":[{"prompt":"Топа только вошёл. Что сказать?","choices":["Hello!","Goodbye!","Good night!"],"answer":0,"feedback":["Hello подходит для приветствия.","«Goodbye!» здесь не подходит. Hello подходит для приветствия.","«Good night!» здесь не подходит. Hello подходит для приветствия."]},{"prompt":"Топа уходит после игры. Что сказать?","choices":["My name is Topa.","Goodbye!","Hello!"],"answer":1,"feedback":["«My name is Topa.» здесь не подходит. Goodbye — прощание.","Goodbye — прощание.","«Hello!» здесь не подходит. Goodbye — прощание."]},{"prompt":"Кукольный гость приходит на выставку. Выбери приветствие.","choices":["Bye!","See you!","Hi!"],"answer":2,"feedback":["«Bye!» здесь не подходит. Hi — короткое приветствие.","«See you!» здесь не подходит. Hi — короткое приветствие.","Hi — короткое приветствие."]},{"prompt":"Друзья закрывают мастерскую и уходят. Что сказать?","choices":["See you!","Hi!","Good morning!"],"answer":0,"feedback":["See you говорят при расставании.","«Hi!» здесь не подходит. See you говорят при расставании.","«Good morning!» здесь не подходит. See you говорят при расставании."]}]},{"id":"en-11","title":"Меня зовут…","goal":"Спросить и назвать имя вымышленного персонажа.","intro":"Сначала попробуй два задания. Потом проверь, получится ли применить тот же приём в новой ситуации.","steps":[{"prompt":"Что означает «My name is Topa»?","choices":["Это игрушка Топы.","Меня зовут Топа.","Я ищу Топу."],"answer":1,"feedback":["«Это игрушка Топы.» здесь не подходит. My name is помогает назвать себя.","My name is помогает назвать себя.","«Я ищу Топу.» здесь не подходит. My name is помогает назвать себя."]},{"prompt":"Кто отвечает «My name is Pip»?","choices":["Топа","Ух","Пип"],"answer":2,"feedback":["«Топа» здесь не подходит. Слова после is здесь называют имя.","«Ух» здесь не подходит. Слова после is здесь называют имя.","Слова после is здесь называют имя."]},{"prompt":"Робот спрашивает «What’s your name?» Что отвечает персонаж Ники?","choices":["My name is Niki.","I am fine.","I like milk."],"answer":0,"feedback":["Вопрос об имени, не о самочувствии или еде.","«I am fine.» здесь не подходит. Вопрос об имени, не о самочувствии или еде.","«I like milk.» здесь не подходит. Вопрос об имени, не о самочувствии или еде."]},{"prompt":"Как спросить имя вымышленного зайца?","choices":["Can you run?","What’s your name?","Where is the rabbit?"],"answer":1,"feedback":["«Can you run?» здесь не подходит. Name указывает на имя.","Name указывает на имя.","«Where is the rabbit?» здесь не подходит. Name указывает на имя."]}]}]}]</script>
<script>
'use strict';
const courses=JSON.parse(document.getElementById('course-data').textContent), app=document.getElementById('app');
const completed=new Map();
let active=null,current=null,index=0,mistake=false,correctFirst=0,locked=false;
const el=(tag,text,klass)=>{const v=document.createElement(tag);if(text)v.textContent=text;if(klass)v.className=klass;return v};
function bn(text,cls,action){const b=el('button',text,cls);b.type='button';b.addEventListener('click',action);return b}
function heading(target,text,tag='h1'){const h=el(tag,text);h.tabIndex=-1;target.append(h);requestAnimationFrame(()=>h.focus({preventScroll:true}));return h}
function clear(){app.replaceChildren();window.scrollTo(0,0)}
function crumb(items){const t=el('nav','', 'crumbs');t.setAttribute('aria-label','Навигация');for(const [txt,fn] of items)t.append(bn(txt,'routeB',fn));if(items.length>1)t.lastChild.setAttribute('aria-current','page');app.append(t)}
function card(title,note,action,cls){const b=bn('',cls,action);b.append(el('strong',title),el('span',note,'cardNote'));return b}
function home(){active=null;current=null;clear();const hero=el('section','','hero');app.append(hero);heading(hero,'Выбери, чем заняться');hero.append(el('p','Короткие занятия для второго класса. Здесь можно пробовать задания и возвращаться к ним. Результаты не отправляются и сбрасываются при закрытии страницы.'));const g=el('div','','grid');for(const c of courses){g.append(card(c.title,c.id==='en'?'Задания из маршрута Топы · черновик':c.lessons.length+' уроков',()=>list(c),'courseCard'))}app.append(g)}
function list(c){active=c;current=null;clear();crumb([['Все предметы',home]]);const h=el('section','','hero');app.append(h);heading(h,c.title);h.append(el('p',c.id==='en'?'Здесь можно попробовать упражнения отдельно от настоящей карты. Паспорт, звёзды и правила открытия островов не меняются.':'Это учебная последовательность, а не расписание школы. Можно начать с текущей темы.'));const g=el('div','','grid');for(const [j,l] of c.lessons.entries()){const done=completed.has(l.id);g.append(card((j+1)+'. '+l.title,done?'Пройдено в этом сеансе · '+l.goal:l.goal,()=>start(c,l),'lessonCard'))}app.append(g)}
function start(c,l){active=c;current=l;index=0;correctFirst=0;mistake=false;locked=false;clear();crumb([['Все предметы',home],[c.title,()=>list(c)]]);const p=el('article','','lessonPage');app.append(p);heading(p,l.title);const b=el('section','','paper');b.append(el('p',l.goal),el('p',l.intro,'introText'));b.lastChild.style.marginTop='13px';const row=el('div','','toolrow');row.append(bn('Начать занятие','primary',step));b.append(row,el('p',l.source,'source'));p.append(b)}
function step(){
 if(!active||!current)return home();if(index>=current.steps.length)return end();
 clear();crumb([['Все предметы',home],[active.title,()=>list(active)]]);
 const p=el('article','','lessonPage');app.append(p);heading(p,current.title,'h2');
 const meter=el('div','','bar');meter.setAttribute('aria-label','Задание '+(index+1)+' из '+current.steps.length);meter.setAttribute('role','img');for(let i=0;i<current.steps.length;i++)meter.append(el('span','',i<index?'done':i===index?'now':''));p.append(meter);
 const d=el('details','','reading');d.append(el('summary','Вспомнить пример'),el('p',current.intro));if(index===0)d.open=true;p.append(d);
 const paper=el('section','','paper'), group=el('fieldset'), s=current.steps[index];p.append(paper);group.append(el('legend',s.prompt));paper.append(group);
 const opts=el('div','','answers');group.append(opts);
 const comment=el('p','','comment');comment.setAttribute('role','status');comment.setAttribute('aria-live','polite');paper.append(comment);
 const row=el('div','','toolrow');const next=bn(index+1===current.steps.length?'Посмотреть результат':'Дальше','primary',()=>{index++;mistake=false;locked=false;step()});next.hidden=true;row.append(next);paper.append(row);
 const buttons=s.choices.map((t,i)=>bn(t,'choice',()=>{
  if(locked)return;comment.textContent=s.feedback[i];
  if(i===s.answer){if(!mistake)correctFirst++;locked=true;for(const [j,b] of buttons.entries()){b.disabled=true;if(j===i)b.classList.add('right')}help.disabled=true;next.hidden=false;next.focus({preventScroll:true});return}
  mistake=true;buttons[i].classList.add('wrong');buttons[i].disabled=true;const target=buttons.find(q=>!q.disabled);if(target)target.focus({preventScroll:true});
 }));
 opts.append(...buttons);
 const help=bn('Показать ответ','secondary',()=>{if(locked)return;mistake=true;buttons[s.answer].click()});row.append(help);
}
function end(){const c=active,l=current,count=current.steps.length;completed.set(l.id,{correctFirst,count});clear();crumb([['Все предметы',home],[c.title,()=>list(c)]]);const p=el('article','','lessonPage');app.append(p);heading(p,'Занятие завершено');const b=el('section','','paper');p.append(b);b.append(el('h2',l.title),el('p',correctFirst+' из '+count+' с первой попытки','result-pill'),el('p',correctFirst>=l.pass?'Основное получилось. Можно выбрать следующий урок.':'Не страшно, если пока трудно. Можно ещё раз пройти урок с подсказками.'));if(l.practical){const a=el('p','Попробуй на бумаге: '+l.practical,'comment');a.style.marginTop='12px';b.append(a)}const r=el('div','','toolrow');r.append(bn('К списку уроков','primary',()=>list(c)),bn('Попробовать ещё раз','secondary',()=>start(c,l)));b.append(r)}
const fx=document.getElementById('soundFx'), musicBtn=document.getElementById('soundMusic'), aMsg=document.getElementById('audioMessage');
if(fx&&musicBtn&&aMsg){
 let audioCtx=null, fxOn=false, audio=null;
 function tone(kind){
  if(!fxOn||!audioCtx||audioCtx.state!=='running')return;
  const chords={forward:[659.25,783.99],back:[587.33,493.88],finish:[523.25,659.25,783.99]};
  const notes=chords[kind]||chords.forward,t=audioCtx.currentTime+.008;
  notes.forEach((freq,i)=>{
   const node=audioCtx.createOscillator(), gain=audioCtx.createGain(), at=t+i*.047;
   node.type='sine';node.frequency.value=freq;gain.gain.setValueAtTime(.0001,at);
   gain.gain.exponentialRampToValueAtTime(.048,at+.022);gain.gain.exponentialRampToValueAtTime(.0001,at+.16);
   node.connect(gain).connect(audioCtx.destination);node.start(at);node.stop(at+.17);
  });
 }
 function label(btn,title,on){btn.setAttribute('aria-pressed',String(on));btn.textContent=title+': '+(on?'вкл.':'выкл.')}
 fx.onclick=async()=>{
  if(fxOn){fxOn=false;label(fx,'Эффекты',false);return}
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C){aMsg.textContent='Звуковые эффекты недоступны в этом браузере.';return}
  try{audioCtx ||= new C();await audioCtx.resume();fxOn=true;label(fx,'Эффекты',true);aMsg.textContent='';tone('forward')}
  catch(_){aMsg.textContent='Не удалось включить эффекты.'}
 };
 musicBtn.onclick=async()=>{

 app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('routeB'))tone('back');
  else if(b.classList.contains('courseCard')||b.classList.contains('lessonCard'))tone('forward');
  else if(b.textContent==='Посмотреть результат')tone('finish');
  else if(b.textContent==='К списку уроков')tone('back');
  else if(['Начать занятие','Дальше','Попробовать ещё раз'].includes(b.textContent))tone('forward');
 },{capture:true});
 window.addEventListener('pagehide',()=>{if(audio&&!audio.paused)audio.pause();label(musicBtn,'Музыка',false)});
 window.addEventListener('topouh-speech',e=>{if(audio)audio.volume=e.detail?.playing === true ? .05 : .15});
}
