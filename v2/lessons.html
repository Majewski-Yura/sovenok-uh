 На дорожке лежали каштаны в колючих кожурках.» Когда вероятнее всего это происходит?","choices":["Зимой","Осенью","Весной"],"answer":1,"feedback":["Проверь условие. В условии есть подсказка, которая подтверждает этот выбор.","Верно: Осенью.","Попробуй ещё. В условии есть подсказка, которая подтверждает этот выбор."]},{"prompt":"«Утром дворник собрал в корзину жёлтые листья. На дорожке лежали каштаны в колючих кожурках.» Какие две детали вместе подсказывают ответ?","choices":["Утро и корзина","Дорожка и дворник","Опавшие жёлтые листья и каштаны"],"answer":2,"feedback":["Посмотри ещё раз. Этот ответ точнее учитывает условие.","Сверься с заданием. Этот ответ точнее учитывает условие.","Верно: Опавшие жёлтые листья и каштаны."]}]}]},{"id":"world","title":"Человек и мир","lessons":[{"id":"world-01","title":"Живое и неживое","goal":"Различать живые организмы и объекты неживой природы по признакам, а не по одному движению.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 6, 10, 35","intro":"Во дворе после дождя Ух замечает дерево, облако, камень и улитку под листом.","steps":[{"prompt":"Что в этой истории относится к живой природе?","choices":["Дерево и улитка","Облако и камень","Только улитка"],"answer":0,"feedback":["Они растут и нуждаются в воде.","Ни облако, ни камень не растут как живые организмы.","Дерево тоже живой организм."]},{"prompt":"Улитка замерла. Почему она всё равно живая?","choices":["Она похожа на камень","Она питается и растёт","Она сейчас ползёт"],"answer":1,"feedback":["Внешнее сходство с камнем ничего не говорит о жизни.","Животное не перестаёт жить, когда отдыхает.","В истории улитка не двигается."]},{"prompt":"Ветер катит сухой камешек по наклонной дорожке. Доказывает ли движение, что камешек живой?","choices":["Да, всё движущееся живое","Да, если он движется быстро","Нет, его может сдвинуть внешняя сила"],"answer":2,"feedback":["Неживые вещи тоже меняют положение.","Скорость не показывает, жив ли предмет.","Движение само по себе не признак жизни."]},{"prompt":"Что скорее поможет узнать, живой ли росток?","choices":["Понаблюдать, растут ли новые листья","Сравнить цвет горшка и листа","Проверить, умеет ли росток бегать"],"answer":0,"feedback":["Рост и развитие помогают узнать живое растение.","Цвет горшка не говорит о ростке.","Растение живое, хотя не бегает."]}],"pass":3},{"id":"world-02","title":"Воздух вокруг нас","goal":"Приводить пример, по которому можно заметить движение воздуха.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 11","intro":"На первом рисунке лента флажка свисает вниз. На втором та же лента вытянулась вбок.","steps":[{"prompt":"На каком рисунке легче заметить ветер?","choices":["На первом","На обоих одинаково хорошо","На втором"],"answer":2,"feedback":["Свисающая лента не даёт такой подсказки.","Рисунки показывают разные положения ленты.","Лента вытянулась в сторону под действием ветра."]},{"prompt":"Что двигает ленту в истории?","choices":["Воздух","Цвет флажка","Тень от флажка"],"answer":0,"feedback":["Ветер — это движение воздуха.","Окраска предмета не заставляет его двигаться.","Тень появляется из-за света, она не толкает предметы."]},{"prompt":"Что ещё можно заметить на картинке ветреного двора?","choices":["На скамейке нарисована полоска","Тонкие ветви качаются","Камень отбрасывает тень"],"answer":1,"feedback":["Рисунок на скамейке не связан с ветром.","Ветер способен двигать ветки.","Тень показывает, откуда падает свет."]},{"prompt":"На новом рисунке флажка нет. Какой признак всё равно выдаёт ветер?","choices":["Дорожка серая","На клумбе три цветка","Сухие листья летят в одну сторону"],"answer":2,"feedback":["Цвет асфальта не меняется из-за ветра.","Число цветков не показывает движение воздуха.","Летящие листья показывают движение воздуха."]}],"pass":3},{"id":"world-03","title":"Где есть вода","goal":"Находить воду в знакомых ситуациях и объяснять, зачем она нужна живому.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 19","intro":"После дождя в парке блестят лужа и капли на траве. Садовница поливает цветы.","steps":[{"prompt":"Где в истории есть вода?","choices":["Только на дорожке","В луже и в каплях на траве","В сухой скамейке и в табличке"],"answer":1,"feedback":["Вода осталась также на траве.","И лужа, и капли образовались из дождевой воды.","Эти предметы не названы местами с водой."]},{"prompt":"Зачем садовница поливает цветы?","choices":["Чтобы лепестки стали деревянными","Чтобы растения могли ходить","Чтобы растения получали нужную им воду"],"answer":2,"feedback":["Вода помогает цветку расти, а не меняет его в дерево.","Растения не ходят после полива.","Растениям нужна вода для жизни и роста."]},{"prompt":"Почему в истории после дождя на дорожке появилась лужа?","choices":["Вода собралась в углублении","Дорожка сделала воду из камня","Травинки выжали воду из воздуха"],"answer":0,"feedback":["Дождевая вода может собираться в низких местах.","Камень не превращается в дождевую воду.","Капли на траве не объясняют всю лужу."]},{"prompt":"У вымышленного кролика есть сено, укрытие и пустая миска. Чего не хватает?","choices":["Второго пустого укрытия","Доступа к питьевой воде","Нарисованной лужи"],"answer":1,"feedback":["Укрытие уже есть, а воды нет.","Как и растениям, животным нужна вода.","Рисунок не может заменить настоящую воду."]}],"pass":3},{"id":"world-04","title":"Почва и растение","goal":"Показывать, где находятся корни и почему почва важна для многих растений.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 27, 36","intro":"На схеме клумбы под коричневым слоем ветвятся корни. Над ним видны стебель и листья.","steps":[{"prompt":"Какая часть на схеме спрятана в почве?","choices":["Корни","Листья","Верхушка стебля"],"answer":0,"feedback":["Их веточки на рисунке находятся под поверхностью.","На схеме листья находятся над почвой.","Верхушка показана над землёй."]},{"prompt":"Что корни получают из влажной почвы?","choices":["Солнечный свет","Воду","Готовые листья"],"answer":1,"feedback":["Свет получает надземная часть растения.","Вода из почвы поступает к растению через корни.","Листья вырастают из самого растения."]},{"prompt":"Какую роль почва играет, кроме запаса воды?","choices":["Она переносит растение с места на место","Она заменяет листья","Она помогает корням удерживать растение"],"answer":2,"feedback":["Закрепившиеся корни обычно удерживают его на одном месте.","Листья выполняют свои задачи и не заменяются почвой.","Корни закрепляются в почве."]},{"prompt":"На схеме фасоли слева подписи потерялись. Как узнать корни?","choices":["Найти разветвления, уходящие от стебля в почву","Выбрать самую верхнюю пару листьев","Выбрать подпись на краю рисунка"],"answer":0,"feedback":["Место и форма помогают узнать корни.","Листья видны над землёй.","Положение подписи ничего не говорит о части растения."]}],"pass":3},{"id":"world-05","title":"Растения, грибы и животные","goal":"Различать три группы на примерах без вывода о пригодности грибов в пищу.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 35–36, 73, 76","intro":"Ух рисует для выставки берёзу, ежа и лесной гриб. Рисунки нужны, чтобы различать группы живого.","steps":[{"prompt":"В какую группу попадает берёза?","choices":["Животные","Грибы","Растения"],"answer":2,"feedback":["Берёза не животное, хотя она тоже живая.","Листья и ствол здесь принадлежат дереву.","Берёза — дерево, а деревья относятся к растениям."]},{"prompt":"К какой группе относится ёж?","choices":["Животные","Растения","Грибы"],"answer":0,"feedback":["Ёж питается, растёт и передвигается как животное.","Колючки сами по себе не делают ежа растением.","Ёж не гриб, даже если они оба встречаются в лесу."]},{"prompt":"Что написать на третьей карточке выставки?","choices":["Растения","Грибы","Животные"],"answer":1,"feedback":["Грибы не растения, даже если растут рядом с ними.","Лесной гриб относится к особой группе живого.","Грибы не относятся к животным."]},{"prompt":"Можно ли по рисунку решить, что похожий гриб в лесу можно есть?","choices":["Да, если совпадает цвет","Да, если гриб небольшой","Нет, по рисунку этого не определяют"],"answer":2,"feedback":["Похожие по цвету грибы могут быть очень разными.","Размер не показывает, съедобен ли гриб.","Незнакомые грибы не трогают и не пробуют; о находке можно сказать взрослому."]}],"pass":3},{"id":"world-06","title":"Как животные живут в природе","goal":"Сопоставлять знакомое животное с подходящей для него средой.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 76","intro":"Редактор рисованной энциклопедии подбирает места для щуки, белки и полевой мыши.","steps":[{"prompt":"Какая сцена подходит щуке?","choices":["Ветка сосны","Пресный водоём","Сухая нора в поле"],"answer":1,"feedback":["Щука не живёт на дереве.","Щука живёт в воде и дышит жабрами.","В сухой норе щука не может жить."]},{"prompt":"Что на рисунке леса может помочь белке найти пищу?","choices":["Каменная табличка","Гладкая лужа на дорожке","Шишки на дереве"],"answer":2,"feedback":["Табличка не даёт белке еды.","В этой подсказке речь о пище, а не о воде.","Белка может питаться семенами из шишек."]},{"prompt":"Где на рисунке поля мышь может укрыться?","choices":["В норе","На открытой верхушке флагштока","В глубокой воде"],"answer":0,"feedback":["Нора служит мыши укрытием.","На высоком открытом месте нет подходящего укрытия.","Полевая мышь не прячется в глубокой воде."]},{"prompt":"На другой странице нарисована лягушка. Какая деталь лучше подходит к рассказу о её среде?","choices":["Сухой подоконник без воды","Берег пруда с водными растениями","Пустая дорожная коробка"],"answer":1,"feedback":["Такое место не похоже на среду у водоёма.","Вода и укрытия около берега подходят многим лягушкам.","В коробке нет нужных условий для жизни лягушки."]}],"pass":3},{"id":"world-07","title":"Забота о здоровье","goal":"Собирать разумную цепочку повседневных привычек без оценивания ребёнка или семьи.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 114, 118, 123","intro":"В истории про обед персонаж закончил рисовать, а взрослый позвал к столу.","steps":[{"prompt":"Что лучше сделать перед едой?","choices":["Вымыть руки","Подвинуть чашку карандашом","Подождать окончания обеда"],"answer":0,"feedback":["Чистые руки помогают не переносить грязь на еду.","Это не делает руки чистыми.","Руки полезно вымыть до того, как берёшь еду."]},{"prompt":"Какой порядок подходит истории?","choices":["Поесть, вымыть руки, снова накрыть к обеду","Вымыть руки, поесть, убрать за собой","Убрать за собой, а потом начать обед"],"answer":1,"feedback":["Так мытьё рук не происходит перед едой.","Мытьё рук предшествует еде, а уборка завершает обед.","Уборка своего места обычно завершает обед."]},{"prompt":"Какой вымышленный обед показывает разнообразие еды?","choices":["Три порции одной и той же каши","Один сорт яблока в трёх тарелках","Гречка, фасоль и нарезанные овощи"],"answer":2,"feedback":["Количество порций не делает еду разнообразной.","Это один и тот же продукт.","Здесь есть продукты из разных групп."]},{"prompt":"После прогулки герои собираются на перекус. Какое правило переносится из истории про обед?","choices":["Сначала вымыть руки","Сначала спрятать салфетки","Мыть руки только после рисования"],"answer":0,"feedback":["Это полезно перед перекусом так же, как перед обедом.","Салфетки не заменяют чистые руки.","Полезная привычка нужна не только после рисования."]}],"pass":3},{"id":"world-08","title":"Семья, правила и права","goal":"Различать право ребёнка и посильный способ заботиться о других.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 128–132","intro":"В придуманной семье один герой устал после занятий, другой собирает игрушки перед ужином.","steps":[{"prompt":"Что из этого относится к праву ребёнка?","choices":["Побеждать в каждой игре","Заставлять другого играть","Отдыхать и играть"],"answer":2,"feedback":["Право на игру не означает гарантированной победы.","Уважать отдых важно у каждого.","Право на отдых есть у каждого ребёнка."]},{"prompt":"Как можно посильно помочь близким?","choices":["Убрать собственные игрушки","Выполнить все дела за взрослых","Переложить свои вещи на чужое место"],"answer":0,"feedback":["Это небольшое дело, с которым герой может справиться.","Помощь не обязана быть большой или непосильной.","Это создаёт новую работу другим."]},{"prompt":"Герой устал, а игрушки ещё на полу. Какая просьба уважает обоих?","choices":["«Ты не имеешь права отдыхать»","«Давай отдохнём, потом вместе уберём игрушки»","«Мои вещи всегда убираешь ты»"],"answer":1,"feedback":["Уставшему герою нужно время на отдых.","Здесь есть время на отдых и участие в общем деле.","Это перекладывает свою посильную работу на другого."]},{"prompt":"В новой истории герои выбирают, как играть вместе. Что согласуется с уважением к другим?","choices":["Продолжать настаивать, если он отказался","Спрятать его игрушку, чтобы он согласился","Спросить, хочет ли другой герой играть сейчас"],"answer":2,"feedback":["Отказ и право на отдых важно уважать.","Это мешает свободному выбору.","У другого героя тоже есть выбор и право отдохнуть."]}],"pass":3},{"id":"world-09","title":"Откуда берутся вещи","goal":"Связывать знакомую вещь с несколькими видами труда.","source":"Г. В. Трафимова, С. А. Трафимов. «Человек и мир». 2 класс, 2024. с. 136, 139","intro":"На выставке сделали четыре карточки об обычной тетради: бумага, изготовление, доставка, книжный магазин.","steps":[{"prompt":"Какая карточка обозначает материал тетради?","choices":["Доставка","Бумага","Книжный магазин"],"answer":1,"feedback":["Это этап перемещения, не материал.","Из неё делают листы.","Там тетрадь можно купить, но это не материал."]},{"prompt":"Что происходит прежде, чем готовую тетрадь доставят?","choices":["Её уже продаёт магазин","Покупатель начинает в ней писать","Из бумаги изготавливают тетрадь"],"answer":2,"feedback":["Магазин сначала должен получить тетрадь.","Писать в неё можно уже после получения.","Сначала появляется готовый предмет, потом его везут."]},{"prompt":"Какой порядок подходит всем четырём карточкам?","choices":["Бумага → изготовление → доставка → магазин","Магазин → доставка → бумага → изготовление","Доставка → изготовление → магазин → бумага"],"answer":0,"feedback":["Так показаны материал, работа и путь готовой вещи.","В магазин тетрадь попадает после изготовления и доставки.","Сначала нужен материал, а доставляют уже готовую вещь."]},{"prompt":"Из мастерской в магазин везут деревянную игрушку. Как называют этот этап?","choices":["Изготовление","Доставка","Выбор материала"],"answer":1,"feedback":["Игрушку уже сделали в мастерской.","Перевозка готового предмета — доставка.","Материал выбирают до изготовления, а не во время перевозки."]}],"pass":3},{"id":"world-10","title":"Следы живого","goal":"Узнавать признаки живого по наблюдениям.","intro":"Ни один признак сам по себе не решает всё. Ветер двигает листья, но сам ветер не растёт.","steps":[{"prompt":"Что помогает понять, что маленький клён живой?","choices":["По стволу скатилась капля","На ветке выросли новые листья","Тень от клёна стала длиннее"],"answer":1,"feedback":["Этот вариант не подходит: «по стволу скатилась капля». Ещё раз посмотри на условие.","Рост новых листьев показывает, что дерево развивается.","Этот вариант не подходит: «тень от клёна стала длиннее». Проверь, относится ли выбор к ситуации."]},{"prompt":"Какой объект живой, хотя на рисунке он неподвижен?","choices":["Пустая ракушка на песке","Камень у дорожки","Улитка в раковине"],"answer":2,"feedback":["Этот вариант не подходит: «пустая ракушка на песке». Ещё раз посмотри на условие.","Этот вариант не подходит: «камень у дорожки». Сравни последствия трёх вариантов.","Улитка может спрятаться и не двигаться, но она живая."]},{"prompt":"Почему лужа не становится живой, когда её поверхность дрожит?","choices":["Лужа слишком маленькая","Рябь вызвал ветер","Вода не занимает места"],"answer":1,"feedback":["Этот вариант не подходит: «лужа слишком маленькая». Сравни последствия трёх вариантов.","Движение поверхности вызвано воздухом и не означает, что лужа живая.","Этот вариант не подходит: «вода не занимает места». Найди объяснение, которое подходит к рисунку."]},{"prompt":"На двух снимках через неделю у мха появились новые участки. Что это показывает?","choices":["Камень под ним тоже рос","Мох рос","Любая зелёная вещь живая"],"answer":1,"feedback":["Этот вариант не подходит: «камень под ним тоже рос». Найди объяснение, которое подходит к рисунку.","Новые участки мха помогают заметить рост.","Этот вариант не подходит: «любая зелёная вещь живая». Проверь, относится ли выбор к ситуации."]}]},{"id":"world-11","title":"Движение воздуха","goal":"Замечать ветер по изменениям окружающих предметов.","intro":"Сам воздух обычно не виден. Зато можно сравнить, что происходит с лёгкими предметами.","steps":[{"prompt":"Какой признак заметнее всего при ветре?","choices":["У забора лежит кирпич","Веточки качаются в одной стороне двора","На стволе нарисована метка"],"answer":1,"feedback":["Этот вариант не подходит: «у забора лежит кирпич». Сравни последствия трёх вариантов.","Ветер может раскачивать тонкие веточки.","Этот вариант не подходит: «на стволе нарисована метка». Ещё раз посмотри на условие."]},{"prompt":"Что видно на двух кадрах, если лист понесло ветром?","choices":["От листа не осталось тени","Лист внезапно стал тяжелее кирпича","Лёгкий лист переместился с места на место"],"answer":2,"feedback":["Этот вариант не подходит: «от листа не осталось тени». Найди объяснение, которое подходит к рисунку.","Этот вариант не подходит: «лист внезапно стал тяжелее кирпича». Сравни последствия трёх вариантов.","Сравнение положения листа позволяет заметить движение воздуха."]},{"prompt":"На тихой улице бумажные полоски висят прямо, на мосту отклоняются. Чем отличаются места на снимках?","choices":["На мосту бумага стала другим материалом","Полоски растут быстрее рядом с водой","На мосту полоски отклоняются от движения воздуха"],"answer":2,"feedback":["Этот вариант не подходит: «на мосту бумага стала другим материалом». Найди объяснение, которое подходит к рисунку.","Этот вариант не подходит: «полоски растут быстрее рядом с водой». Проверь, относится ли выбор к ситуации.","Воздух действует на лёгкие полоски там, где они отклоняются."]},{"prompt":"Какой предмет лучше всего покажет ветер из окна?","choices":["Лёгкая лента, привязанная на улице","Кирпич на земле","Фотография ленты на стене"],"answer":0,"feedback":["Лёгкая свободная часть ленты меняет положение.","Этот вариант не подходит: «кирпич на земле». Ещё раз посмотри на условие.","Этот вариант не подходит: «фотография ленты на стене». Проверь, относится ли выбор к ситуации."]}]}]},{"id":"safety","title":"Основы безопасности жизнедеятельности","lessons":[{"id":"safety-01","title":"Что значит заметить риск","goal":"Отличать обычную ситуацию от той, в которой лучше остановиться и обратиться к взрослому.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 5","intro":"На вымышленном рисунке двора одно место огорожено для ремонта, а игровая площадка открыта. Рядом с героями воспитательница.","steps":[{"prompt":"Где герой должен остановиться?","choices":["У свободной скамейки на площадке","Перед ограждением ремонта","У рисунка дерева на стене"],"answer":1,"feedback":["Скамейка не обозначена как опасное место.","Ограждение показывает границу, за которую не заходят.","Обычный рисунок не означает ремонт."]},{"prompt":"Как герой может понять, почему дорожка перекрыта?","choices":["Самому заглянуть за ограждение","Решить, что перегородка для игры","Спросить воспитательницу, не заходя за ограждение"],"answer":2,"feedback":["Смысл ограждения в том, чтобы оставаться снаружи.","Ограждение предупреждает, а не приглашает играть.","Взрослый поможет разобраться безопасно."]},{"prompt":"Что точно указывает, что открытая площадка и участок ремонта различаются?","choices":["Предупреждение и ограждение только у ремонта","Площадка дальше от скамейки","Изображение площадки крупнее"],"answer":0,"feedback":["Это видимые знаки закрытого участка.","Расстояние ничего не говорит о перекрытии.","Размер рисунка не показывает опасность."]},{"prompt":"В другом дворе герою непонятен новый предупреждающий знак. Какой первый шаг подходит?","choices":["Посчитать таблички и пойти дальше","Остановиться и спросить взрослого, которому он доверяет","Угадать значение и никому не говорить"],"answer":1,"feedback":["Число знаков не объясняет предупреждение.","Не нужно сначала проверять риск самому.","В сомнении полезна помощь взрослого."]}],"pass":3},{"id":"safety-02","title":"Маршрут в школу","goal":"Выбирать условный маршрут с тротуаром и обозначенным переходом, а не просто кратчайший.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 6, 14","intro":"На придуманной карте длинный путь в школу идёт по тротуару к обозначенному переходу. Короткая тропа обрывается у дороги без перехода.","steps":[{"prompt":"Какой маршрут выбрать герою вместе со взрослым?","choices":["Длинный, с тротуаром и переходом","Короткий, заканчивающийся у дороги","Тот, что на рисунке ярче"],"answer":0,"feedback":["Подходящее место для ходьбы и перехода важнее длины.","На короткой тропе не предусмотрено безопасное место для перехода.","Цвет линии сам по себе не делает путь безопасным."]},{"prompt":"Как найти удобную часть длинного пути?","choices":["Искать подпись «проезжая часть»","Искать подпись «тротуар»","Искать самую толстую линию карты"],"answer":1,"feedback":["Эта часть предназначена для транспорта.","Тротуар обозначает место для пешеходов.","Толщина линии без пояснения не говорит, где идти."]},{"prompt":"Что ещё, кроме тротуара, нужно найти перед пересечением дороги?","choices":["Дерево напротив школы","Самое узкое место на рисунке","Обозначенный пешеходный переход"],"answer":2,"feedback":["Дерево не обозначает переход.","Ширина на картинке не означает, что там можно переходить.","Он показывает место, предназначенное для перехода."]},{"prompt":"На новой карте знакомый тротуар перекрыли. Что лучше выбрать?","choices":["Остановиться и вместе со взрослым найти открытый маршрут","Следовать старой линии на карте, не обращая внимания на перекрытие","Выбрать любую короткую тропу наугад"],"answer":0,"feedback":["Если путь изменился, взрослый поможет выбрать другой безопасный вариант.","Схема не отменяет реальное ограничение.","Короткий путь не обязательно подходит пешеходу."]}],"pass":3},{"id":"safety-03","title":"Светофор и пешеход","goal":"Читать сигнал светофора и не воспринимать зелёный как разрешение бежать не глядя.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 30, 35","intro":"В вымышленной сцене герои стоят у перехода с учительницей. Сигналы подписаны словами «красный» и «зелёный».","steps":[{"prompt":"Пешеходам горит «красный». Что делают герои?","choices":["Идут, потому что спешат","Делают шаг вперёд, чтобы проверить сигнал","Остаются ждать рядом с учительницей"],"answer":2,"feedback":["Спешка не меняет значения сигнала.","Проверять сигнал можно, оставаясь на месте.","Красный сигнал означает, что начинать переход нельзя."]},{"prompt":"Появился «зелёный», но машина ещё движется у перехода. Что выбрать?","choices":["Дождаться, когда переход будет свободен, рядом со взрослым","Считать зелёный достаточным и сразу бежать","Идти, глядя только на светофор"],"answer":0,"feedback":["Зелёный сигнал не заменяет проверку обстановки.","Движущаяся машина ещё не освободила переход.","Важно учитывать, что происходит на дороге."]},{"prompt":"Горит «зелёный», переход свободен, взрослый убедился, что можно идти. Как герои идут?","choices":["Наперегонки","Спокойным шагом со взрослым","Отвлекаясь на игру на экране"],"answer":1,"feedback":["Во время гонки труднее замечать обстановку.","Спокойное движение помогает следить за дорогой.","Экран отвлекает внимание от дороги."]},{"prompt":"На новом рисунке один герой сомневается, какой сигнал видит. Как ему поступить?","choices":["Выбрать наугад и пойти","Повторить за бегущим мимо персонажем","Остаться со взрослым и уточнить сигнал"],"answer":2,"feedback":["В этом случае нет уверенности, что переход разрешён.","Действия других не объясняют, какой сигнал горит.","Угадывать при сомнении не нужно."]}],"pass":3},{"id":"safety-04","title":"Личные границы","goal":"Распознавать неудобную просьбу и выбирать обращение к доверенному взрослому.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 56","intro":"В вымышленной библиотеке незнакомый персонаж предлагает герою уйти с ним в другое помещение. Рядом работает знакомая учительница.","steps":[{"prompt":"Как герой может ответить?","choices":["Согласиться из вежливости","Отказаться и остаться рядом с учительницей","Передать свои контактные данные вместо ответа"],"answer":1,"feedback":["Вежливость не требует уходить с незнакомым человеком.","Герой не обязан соглашаться на предложение, которое его тревожит.","Личные данные не нужны, чтобы отказаться."]},{"prompt":"Кому лучше рассказать о просьбе?","choices":["Тому, кто просит уйти","Никому, даже если тревожно","Знакомой учительнице"],"answer":2,"feedback":["Именно эта просьба вызвала тревогу.","С тревогой не обязательно оставаться одному.","Это взрослый, которого герой знает и которому доверяет."]},{"prompt":"Если незнакомый персонаж говорит «не рассказывай», что может сделать герой?","choices":["Всё равно обратиться к доверенному взрослому","Считать просьбу обещанием, которое нельзя нарушать","Сначала уйти с персонажем, а потом решить"],"answer":0,"feedback":["Просьба хранить тревожную тайну не отменяет право на помощь.","В тревожной ситуации обратиться за помощью можно.","За помощью лучше обратиться, не уходя с ним."]},{"prompt":"В другой истории знакомый персонаж настойчиво просит сделать то, что пугает героя. Что остаётся верным?","choices":["Знакомым всегда нужно соглашаться помочь","Можно отказаться и рассказать доверенному взрослому","Надо доказать смелость и согласиться"],"answer":1,"feedback":["Знакомство не отменяет право отказаться.","Личные границы важны и со знакомыми людьми.","Смелость может быть в том, чтобы отказаться и позвать на помощь."]}],"pass":3},{"id":"safety-05","title":"Если заметил дым","goal":"Выбирать сообщение взрослому и уход из опасной ситуации без попыток тушить или спасать вещи.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 71","intro":"На текстовой карточке из школьного коридора виден дым. Рядом с героями находится учитель.","steps":[{"prompt":"Что лучше сделать, заметив дым?","choices":["Сразу предупредить учителя и вместе уйти из опасной зоны по его указанию","Сначала искать потерянный пенал","Подойти ближе, чтобы получше рассмотреть дым"],"answer":0,"feedback":["Помощь взрослого и уход важнее любых вещей.","Не стоит задерживаться ради вещей.","Приближаться к источнику дыма небезопасно."]},{"prompt":"Пенал остался в комнате, откуда виден дым. Что выбрать?","choices":["Вернуться за пеналом на минутку","Не возвращаться за ним","Попросить другого ребёнка сходить за ним"],"answer":1,"feedback":["Даже короткое возвращение задерживает уход.","В опасной ситуации вещи оставляют.","Не нужно отправлять другого человека в опасное место."]},{"prompt":"Учитель указывает свободное безопасное направление. Что делают герои?","choices":["Остаются посмотреть, исчезнет ли дым сам","Расходятся по одному за своими вещами","Уходят с учителем в указанном направлении"],"answer":2,"feedback":["Ожидание в опасной зоне не помогает.","Важно уйти по указанию, а не возвращаться за вещами.","Взрослый руководит уходом; не нужно искать свой путь без него."]},{"prompt":"В новом сюжете дыма не видит сопровождающий взрослый. Что сделать герою?","choices":["Сразу сказать взрослому и не подходить к дыму","Договориться рассказать позже","Начать самостоятельно разбираться с источником"],"answer":0,"feedback":["Взрослый не всегда видит то же самое; важно сразу предупредить.","Задерживать предупреждение не нужно.","Это не задача ребёнка."]}],"pass":3},{"id":"safety-06","title":"Безопасные решения дома и в школе","goal":"Определять ситуации, где нельзя трогать предмет или где нужна помощь взрослого.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 87–92","intro":"На вымышленных карточках дома заметен повреждённый провод, а в школьном проходе разлита жидкость.","steps":[{"prompt":"Что сделать герою, увидев повреждённый провод?","choices":["Потрогать, чтобы проверить повреждение","Переставить его самому","Не трогать и предупредить взрослого"],"answer":2,"feedback":["Проверять повреждённый провод руками опасно.","Провод не нужно двигать самостоятельно.","Взрослому можно сказать о проблеме, оставаясь на расстоянии."]},{"prompt":"Как поступить при пролитой неизвестной жидкости в проходе?","choices":["Остановиться, не наступать и сообщить учителю","Прыгнуть через лужу","Убирать неизвестную жидкость самостоятельно"],"answer":0,"feedback":["Так взрослый сможет помочь и предупредить других.","Рядом с лужей можно поскользнуться.","Сначала взрослый должен разобраться, что произошло."]},{"prompt":"Что общего у обеих карточек?","choices":["Обе проблемы нужно исправить самому","Герой может не трогать опасное место и позвать взрослого","Обе проблемы можно просто скрыть"],"answer":1,"feedback":["Предупредить взрослого важнее самостоятельного исправления.","Это безопасный выбор в обеих историях.","Другим важно узнать о риске."]},{"prompt":"В новой карточке в проходе лежат осколки. Что выбрать?","choices":["Собрать осколки руками","Подвинуть их обувью","Не трогать осколки и предупредить находящегося рядом взрослого"],"answer":2,"feedback":["Об острые края можно пораниться.","Двигать осколки самостоятельно небезопасно.","Поднимать острые осколки ребёнку не нужно."]}],"pass":3},{"id":"safety-07","title":"Двор и вода","goal":"Распознавать места, куда нельзя заходить без взрослого или за обозначенную границу.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 96, 101","intro":"На карте вымышленного парка игровая поляна обозначена отдельно от закрытого спуска к воде. С героями гуляет взрослый.","steps":[{"prompt":"Где герои могут выбрать место для игры со взрослым?","choices":["За ограждением спуска","На открытой поляне","На самой кромке воды"],"answer":1,"feedback":["Закрытая граница не подходит для игры.","Она обозначена как игровая зона вдали от закрытого спуска.","У воды нужна особая осторожность и помощь взрослого."]},{"prompt":"Мяч укатился к воде. Как поступить герою?","choices":["В одиночку побежать за мячом","Отправить другого ребёнка","Не приближаться к берегу и сказать взрослому"],"answer":2,"feedback":["Приближаться к воде за мячом небезопасно.","Другого ребёнка тоже нельзя посылать в опасное место.","Мяч не стоит самостоятельного похода к воде."]},{"prompt":"Как понять по карте, что спуск закрыт?","choices":["Есть граница и подпись «проход закрыт»","Поляна нарисована крупнее","Вода нарисована синим"],"answer":0,"feedback":["Текст и ограждение прямо обозначают ограничение.","Размер изображения не объясняет, открыт ли проход.","Цвет воды не показывает, разрешён ли спуск."]},{"prompt":"В новом парке рядом с водой лежит игрушечная лодочка. Что не меняется в правиле?","choices":["За маленькой игрушкой можно идти одному","Остаться на расстоянии и обратиться к взрослому","Если игрушка видна, помощь не нужна"],"answer":1,"feedback":["Размер игрушки не делает берег безопаснее.","Неважно, какая игрушка оказалась у берега.","Видеть игрушку не означает, что подход к ней безопасен."]}],"pass":3},{"id":"safety-08","title":"Здоровые привычки","goal":"Выбирать в вымышленной истории полезные привычки без жёстких норм для всех детей.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 109","intro":"В вымышленный свободный день Топа гуляет, играет, перекусывает и оставляет время на отдых.","steps":[{"prompt":"Какая привычка подходит перед перекусом?","choices":["Вымыть руки","Вымыть только свою кружку","Выбрать новую игру вместо мытья рук"],"answer":0,"feedback":["Так меньше грязи попадёт с рук на еду.","Чистая кружка не заменяет мытьё рук.","Смена игры не очищает руки."]},{"prompt":"Топа устал после активной игры. Что поможет отдохнуть?","choices":["Начать новую гонку через силу","Сделать паузу и выбрать спокойное занятие","Остаться без перерыва до вечера"],"answer":1,"feedback":["Более напряжённая игра не заменяет отдыха.","Пауза помогает восстановить силы.","Можно замечать усталость и отдыхать раньше."]},{"prompt":"Какой вымышленный день лучше чередует виды занятий?","choices":["Играть без перерыва весь день","Оставить только одну долгую гонку","Прогулка, обед и спокойный отдых"],"answer":2,"feedback":["Так нет времени на другие нужные занятия.","Это не чередование разных занятий.","Есть движение, еда и пауза."]},{"prompt":"В другом сюжете герой собирается снова рисовать, но уже устал. Что можно перенести из истории Топы?","choices":["Сделать перерыв и вернуться к рисунку после отдыха","Закончить обязательно без паузы","Считать рисунок причиной больше никогда не отдыхать"],"answer":0,"feedback":["Отдых полезен не только после подвижных игр.","Если устал, необязательно принуждать себя продолжать сразу.","Любимое занятие и перерывы могут сочетаться."]}],"pass":3},{"id":"safety-09","title":"Азбука безопасных решений","goal":"Применять правило «остановись и обратись к взрослому» в новой ситуации.","source":"Аброськина, Кузнецова, Одновол. «Основы безопасности жизнедеятельности». 2 класс, 2024. с. 139","intro":"В финале герои разбирают новые текстовые карточки. Ничего из описанного не нужно пробовать в реальности.","steps":[{"prompt":"В кружке герой видит полку, которая накренилась. Что делать ему?","choices":["Держать полку одному","Попросить друга достать предмет с полки","Не подходить и сказать руководителю кружка"],"answer":2,"feedback":["Это опасная задача, которую не нужно решать ребёнку.","Не стоит звать другого ребёнка к опасному месту.","Доверенный взрослый поможет, а герой останется вдали от полки."]},{"prompt":"У входа в спортивный зал герой видит предупреждение, но не понимает его. Что дальше?","choices":["Остаться снаружи и спросить тренера","Войти наугад, чтобы понять знак","Подождать, когда кто-нибудь войдёт, и повторить"],"answer":0,"feedback":["Уточнять назначение знака безопаснее, чем игнорировать его.","Уже сам вход может быть ограничен.","Другой человек может не заметить предупреждение."]},{"prompt":"В библиотеке проход завален неустойчивыми коробками. Что выбрать?","choices":["Протиснуться между коробками","Не проходить и предупредить взрослого сотрудника","Переставить нижнюю коробку"],"answer":1,"feedback":["Неустойчивые коробки могут упасть.","Сотрудник сможет подсказать другой путь и заняться препятствием.","Не нужно самостоятельно двигать неустойчивую стопку."]},{"prompt":"Какое правило пригодилось во всех трёх новых сценах?","choices":["Всегда пробовать решить задачу в одиночку","Действовать как можно быстрее, не глядя вокруг","Остановиться, не проверять риск самому, обратиться к доверенному взрослому"],"answer":2,"feedback":["В незнакомой опасности помощь взрослого уместна.","Спешка не заменяет безопасного решения.","Так можно получить помощь, не приближаясь к опасности."]}],"pass":3},{"id":"safety-10","title":"Остановись и осмотрись","goal":"Замечать простой риск до начала действия.","intro":"Все ситуации нарисованы. Нужно выбрать безопасный следующий шаг, а не пробовать его на улице.","steps":[{"prompt":"У прохода в классе стоит коробка, которую трудно обойти. Что разумнее?","choices":["Сообщить учителю и не бежать через тесный проход","Спрятать коробку и никому не сказать","Перепрыгнуть её с разбега"],"answer":0,"feedback":["Взрослый поможет убрать помеху безопасно.","Этот вариант не подходит: «спрятать коробку и никому не сказать». Ещё раз посмотри на условие.","Этот вариант не подходит: «перепрыгнуть её с разбега». Проверь, относится ли выбор к ситуации."]},{"prompt":"На рисунке дети подходят к ограждению ремонта. Что им выбрать?","choices":["Заходить за ограждение по очереди","Остановиться и спросить взрослого, где можно пройти","Снять предупреждающую табличку"],"answer":1,"feedback":["Этот вариант не подходит: «заходить за ограждение по очереди». Ещё раз посмотри на условие.","Ограждение означает, что обычный путь может быть недоступен.","Этот вариант не подходит: «снять предупреждающую табличку». Сравни последствия трёх вариантов."]},{"prompt":"В дворе привычную дорожку перегородили, рядом действует техника. Что делать персонажу?","choices":["Остаться на безопасном месте и позвать взрослого","Быстро пройти между техникой и оградой","Подойти поближе и попросить технику подождать"],"answer":0,"feedback":["Доверенный взрослый поможет подобрать другой путь.","Этот вариант не подходит: «быстро пройти между техникой и оградой». Сравни последствия трёх вариантов.","Этот вариант не подходит: «подойти поближе и попросить технику подождать». Найди объяснение, которое подходит к рисунку."]},{"prompt":"Ребёнок не знает, можно ли ему одному переставлять тяжёлую полку. Как решить?","choices":["Позвать младшего ребёнка, чтобы вдвоём тянуть","Не трогать полку и попросить помощи взрослого","Проверить, потянув её на себя"],"answer":1,"feedback":["Этот вариант не подходит: «позвать младшего ребёнка, чтобы вдвоём тянуть». Проверь, относится ли выбор к ситуации.","Не нужно узнавать вес предмета рискованной попыткой.","Этот вариант не подходит: «проверить, потянув её на себя». Найди объяснение, которое подходит к рисунку."]}]},{"id":"safety-13","title":"Разговор о личных границах","goal":"Отказывать в неудобной просьбе и обращаться за поддержкой.","intro":"Ребёнку не нужно оправдываться или сообщать личные данные. В сценах используются вымышленные имена.","steps":[{"prompt":"Незнакомый персонаж просит ребёнка уйти с площадки без согласия близких. Что ответить?","choices":["Согласиться из вежливости","Сначала назвать свой адрес","Не идти и обратиться к знакомому взрослому"],"answer":2,"feedback":["Этот вариант не подходит: «согласиться из вежливости». Найди объяснение, которое подходит к рисунку.","Этот вариант не подходит: «сначала назвать свой адрес». Проверь, относится ли выбор к ситуации.","Вежливость не требует соглашаться на то, что тревожит."]},{"prompt":"Кто может помочь, если знакомый человек делает ребёнку неприятное предложение?","choices":["Никто, потому что говорить неудобно","Другой доверенный взрослый, например родитель или учитель","Только тот человек, который это предложил"],"answer":1,"feedback":["Этот вариант не подходит: «никто, потому что говорить неудобно». Ещё раз посмотри на условие.","Можно искать поддержку, даже если просьба исходила от знакомого.","Этот вариант не подходит: «только тот человек, который это предложил». Проверь, относится ли выбор к ситуации."]},{"prompt":"Гость просит сохранить секрет, от которого ребёнку страшно. Что безопаснее?","choices":["Держать тайну, пока никто не спросит","Рассказать доверенному взрослому","Придумать другой страшный секрет"],"answer":1,"feedback":["Этот вариант не подходит: «держать тайну, пока никто не спросит». Ещё раз посмотри на условие.","Тревожный секрет можно и важно обсуждать со взрослым, которому доверяешь.","Этот вариант не подходит: «придумать другой страшный секрет». Сравни последствия трёх вариантов."]},{"prompt":"Кто-то в игре спрашивает, в какой школе учится ребёнок. Как ответить?","choices":["Назвать школу, но не имя","Не сообщать такие данные и обсудить сообщение со взрослым","Отправить расписание и фотографию входа"],"answer":1,"feedback":["Этот вариант не подходит: «назвать школу, но не имя». Сравни последствия трёх вариантов.","Личные сведения не нужны для знакомства в игре.","Этот вариант не подходит: «отправить расписание и фотографию входа». Найди объяснение, которое подходит к рисунку."]}]}]},{"id":"art","title":"Изобразительное искусство","lessons":[{"id":"art-01","title":"Образ времени года","goal":"Передавать впечатление о времени года двумя деталями и цветом.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 4, 9, 15, 81","intro":"В картинке время года угадывают по признакам. Цвет может усиливать впечатление, но проверять лучше и сюжетные детали.","steps":[{"prompt":"Что сильнее всего выдаёт весну?","choices":["Талая вода и первые почки","Красный забор и окно","Большое дерево и облако"],"answer":0,"feedback":["Они показывают, как природа меняется весной.","Такое бывает в любой сезон.","Пока признаков времени года нет."]},{"prompt":"Как показать осень даже без надписи?","choices":["Подписать месяц","Добавить жёлтые и бурые листья под деревом","Нарисовать только зелёный квадрат"],"answer":1,"feedback":["Это ответ словами, а не образ.","Деталь и цвета работают вместе.","Он не объясняет сезон."]},{"prompt":"Что лучше добавить в картинку, если на ней должен быть ясный зимний день?","choices":["Снежные шапки и светлые голубые тени","Только большую оранжевую рамку","Листья, плотно покрывающие ветви"],"answer":0,"feedback":["Они передают снег и ясный свет.","Рамка не показывает зиму.","Это неточная зимняя подсказка."]},{"prompt":"В новой сцене цветут сирень и тюльпаны. Как поддержать весенний образ?","choices":["Добавить молодые светло-зелёные листья и лёгкие лиловые пятна цветков","Покрыть клумбу снежными сугробами","Показать повсюду сухие жёлтые листья"],"answer":0,"feedback":["Это усиливает признаки весны.","Они уводят образ к зиме.","Это сильная осенняя подсказка."]}],"pass":3,"practical":"На листе покажи одно и то же дерево в двух сезонах. Измени две детали."},{"id":"art-02","title":"Оттенки и цветовое настроение","goal":"Различать светлый и тёмный оттенок; использовать тёплую или холодную гамму для выбранного настроения.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 20, 25","intro":"Оттенок может стать светлее или темнее. Тёплые и холодные цвета могут работать в одной картинке, если так задумано.","steps":[{"prompt":"Есть два синих пятна. Как сделать одно из них светлее гуашью?","choices":["Добавить чёрной краски","Добавить немного белой краски","Обвести чёрным"],"answer":1,"feedback":["Синий станет темнее.","Получится светлее, но останется синий оттенок.","Обводка не осветлит синюю краску."]},{"prompt":"Какая пара относится к тёплой гамме?","choices":["Оранжевый и золотисто-жёлтый","Чёрный и белый","Голубой и сине-фиолетовый"],"answer":0,"feedback":["Они напоминают тепло и солнечный свет.","Это не та пара тёплых цветов.","Это холодная пара."]},{"prompt":"Нужно изобразить прохладное утро у озера. Что ближе к замыслу?","choices":["Много оранжевого и красного","Голубой и светлый серо-фиолетовый для воды и неба","Одно чёрное пятно без других деталей"],"answer":1,"feedback":["Это скорее тепло.","Такая гамма поддерживает ощущение прохлады.","Оно не передаёт утро у озера."]},{"prompt":"В холодной зимней сцене нужно выделить окно, где горит свет. Что выбрать?","choices":["Залить весь лист одинаковым жёлтым","Небольшое тёплое жёлто-оранжевое пятно окна на голубом фоне","Сделать окно точно таким же голубым, как фон"],"answer":1,"feedback":["Холодный фон и контраст исчезнут.","Контраст выделит главное.","Оно потеряется."]}],"pass":3,"practical":"Нарисуй два пятна одного цвета: светлое и тёмное. Покажи, как меняется настроение."},{"id":"art-03","title":"Формат и композиция","goal":"Выбирать вертикальный или горизонтальный формат под сюжет и выделять главное.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 34, 43, 52","intro":"Формат выбирают под движение или форму сюжета. Расположение, размер и контраст помогают обратить внимание на главное.","steps":[{"prompt":"Какой формат удобно взять для высокой башни и узкой улицы?","choices":["Широкий горизонтальный","Очень узкая полоска поперёк","Вертикальный"],"answer":2,"feedback":["Он уместнее для протяжённой улицы, а тут главная башня.","В ней башне не хватит высоты.","Он оставляет место вверх, где нужна высота."]},{"prompt":"Как разместить широкую сцену с лодками на реке?","choices":["Горизонтально","Высоко вертикально и все лодки одна над другой","Вырезать из листа маленький угол"],"answer":0,"feedback":["По ширине можно показать размах воды и несколько лодок.","Меняется ощущение реки.","Сюжет не поместится."]},{"prompt":"Главное в кадре — короткий мост. Как помочь зрителю заметить его?","choices":["Спрятать мост полностью за деревьями","Все предметы сделать одинаково яркими","Дать мосту заметное место и контраст"],"answer":2,"feedback":["Зритель его не увидит.","Мост потеряется среди них.","Спокойные детали рядом не отвлекут от него."]},{"prompt":"Новый сюжет: Топа любуется высокой ракетой на старте. Как передать идею?","choices":["Заполнить одинаковыми ракетами весь край листа","Взять вертикальный лист и оставить место над крупной ракетой","Сделать горизонтальную панораму, а ракету спрятать в дальнем углу"],"answer":1,"feedback":["Неясно, какая главная.","Подчеркнётся высота.","Она перестанет быть главной."]}],"pass":3,"practical":"Размести один и тот же предмет на двух листах: вертикальном и горизонтальном. Сравни свободное место."},{"id":"art-04","title":"Формы природы и птица","goal":"Замечать характерную форму силуэта и собирать изображение из простых элементов.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 40, 112","intro":"Силуэт — внешний контур. Иногда узнаваемую форму можно собрать из нескольких простых фигур.","steps":[{"prompt":"Как проще собрать силуэт круглой совы?","choices":["Широкий овал тела, два выступа сверху и короткие лапки","Длинный прямоугольник без выступов","Одна тонкая линия"],"answer":0,"feedback":["Контур будет узнаваемым.","Он скорее похож на коробку.","Она не покажет округлое тело."]},{"prompt":"Какой внешний признак помогает отличить птицу с длинным клювом?","choices":["Рамка рисунка","Цвет фона","Длинный узкий выступ у головы"],"answer":2,"feedback":["Она не относится к силуэту птицы.","У разных птиц фон может быть одним и тем же.","Он показывает форму клюва даже без цвета."]},{"prompt":"На какой стадии легче понять, удачен ли силуэт?","choices":["Сначала посмотреть на плоский контур без деталей","Показать только подпись названия","Только после прорисовки каждого пера"],"answer":0,"feedback":["Так яснее видна форма.","Она не проверит контур.","Форму можно проверить раньше."]},{"prompt":"Новая задача: изобразить утку на воде из простых пятен. Какое решение подходит?","choices":["Вытянутый овал тела у линии воды, круглая голова и короткий широкий клюв","Три одинаковых круга в ряд без головы или клюва","Узкая высокая колонна без подвижных частей"],"answer":0,"feedback":["Основные формы передают утку.","Характер птицы исчезает.","У неё нет нужного силуэта."]}],"pass":3,"practical":"Возьми за основу овал и треугольник. Придумай из этих фигур свой образ, например фантастическую птицу."},{"id":"art-05","title":"Пространство в картинке","goal":"Передавать передний и дальний план размером и перекрытием.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 56, 106","intro":"Объект, который перекрывает другой, обычно кажется ближе. Два одинаковых по виду объекта могут казаться на разном расстоянии из-за размера.","steps":[{"prompt":"Дом частично скрыт стволом. Что перед домом?","choices":["Ничего","Ствол","Дом"],"answer":1,"feedback":["Перекрытие здесь даёт подсказку.","Он пересекает и закрывает часть дома.","В рисунке он закрыт, а не закрывает ствол."]},{"prompt":"Две одинаковые по высоте башни показаны на тропинке. Какая выглядит дальше, если одна нарисована меньше?","choices":["Та, которую нарисовали ярче","Обе одинаково близко","Меньшая по размеру"],"answer":2,"feedback":["Задача даёт подсказку размером.","Размер показан различным.","При одинаковых башнях это подсказка о расстоянии."]},{"prompt":"Как сделать двух сов на разных планах?","choices":["Редактировать только название картинки","Дальнюю сову изобразить меньше, а ближней частично закрыть её крыло","Нарисовать две одинаковые совы рядом без других признаков"],"answer":1,"feedback":["Глубина не изменится.","Обе подсказки покажут расстояние.","Расстояние не прочитается."]},{"prompt":"Хочется выделить дорожку, уходящую к дальнему домику. Что усилит эффект?","choices":["Закрыть весь домик передним забором","Сделать дальнюю часть дорожки заметно шире близкой","Узить дорожку к домику и сделать дальний домик меньше"],"answer":2,"feedback":["Цель дорожки будет не видна.","Она скорее покажется ближе.","Возникнет ощущение глубины."]}],"pass":3,"practical":"Нарисуй два дерева: то, что ближе, сделай крупнее. Объясни, по какой детали видна глубина."},{"id":"art-06","title":"Натюрморт как аппликация","goal":"Выстраивать композицию из предметов с разными размерами и частичным перекрытием.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 61, 66","intro":"Натюрморт показывает предметы. В аппликации композицию можно пробовать до приклеивания, переставляя бумажные формы.","steps":[{"prompt":"Что здесь подходит для натюрморта?","choices":["Два бегущих персонажа","Лес и холмы до горизонта","Яблоко, чашка и кувшин на столе"],"answer":2,"feedback":["Это сценка с действием, не натюрморт.","Это пейзаж.","Это группа предметов."]},{"prompt":"Как лучше показать, что яблоко ближе к зрителю, чем кувшин?","choices":["Вырезать предметы одного цвета и сложить стопкой за экраном","Частично закрыть яблоком нижний край кувшина","Оставить кувшин почти целиком поверх яблока"],"answer":1,"feedback":["Композицию не видно.","Перекрытие покажет ближний план.","Тогда ближе покажется кувшин."]},{"prompt":"Почему сначала стоит разложить формы, а потом приклеивать?","choices":["Так можно переставить предметы и проверить, видно ли главное","Чтобы все бумажки стали одного цвета","Это не имеет значения"],"answer":0,"feedback":["Примерка помогает выбрать композицию.","Раскладка не меняет цвет.","После приклеивания менять композицию сложнее."]},{"prompt":"Главная в натюрморте — красная груша. Что ей поможет выделиться?","choices":["Положить грушу под самый большой кувшин так, что её не видно","Сделать всё одинакового красного цвета и размера","Поставить грушу на спокойный фон, а рядом разместить меньшие нейтральные формы"],"answer":2,"feedback":["Главное потеряется.","Предметы будут спорить за внимание.","Контраст поможет ей выделиться."]}],"pass":3,"practical":"Поставь рядом два безопасных предмета, например чашку и яблоко. Сделай быстрый натюрморт на листе."},{"id":"art-07","title":"Графика, ритм и декор","goal":"Использовать повтор линий, точек или форм для создания ритма.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 71, 76, 87, 92","intro":"Ритм появляется, когда линии, точки или формы повторяются по понятному правилу. Попробуй восстановить правила и придумать свои.","steps":[{"prompt":"Что дальше в ритме «круг, точка, круг, точка»?","choices":["Круг","Две точки","Треугольник"],"answer":0,"feedback":["После точки снова идёт круг.","В этом узоре они не стоят подряд.","В начале его не было."]},{"prompt":"Какой узор чередует формы по правилу «две точки, одна линия»?","choices":["Линия, линия, точка","Точка, линия, точка, линия","Точка, точка, линия, точка, точка, линия"],"answer":2,"feedback":["Здесь правило наоборот.","Здесь только по одной точке.","Правило повторяется без изменения."]},{"prompt":"Что отличает графический узор от полного цветного рисунка?","choices":["В узоре всегда надо использовать семь цветов","В рисунке нельзя применять линии","Узор можно построить одним цветом"],"answer":2,"feedback":["Такого правила нет.","Линии возможны и там, и там.","Выразительные линии и штрихи создадут ритм."]},{"prompt":"Как закончить рамку, если в ней повторяются «лист, круг, круг» и уже есть «лист, круг, круг, лист, круг»?","choices":["Добавить круг","Добавить сразу лист","Добавить две линии"],"answer":0,"feedback":["Он завершит второй повтор.","Второй круг будет пропущен.","Это не продолжит заданный ритм."]}],"pass":3,"practical":"Придумай бордюр и повтори две разные формы три раза. Проверь, где повтор сбился."},{"id":"art-08","title":"Симметрия и орнамент","goal":"Узнавать отражение относительно оси и намеренно выбирать, где его нарушить.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 92, 117","intro":"Если сложить симметричный рисунок по его оси, соответствующие детали совпадут. Асимметрия может быть осознанным выбором.","steps":[{"prompt":"У бабочки слева от оси зелёная точка в 2 клетках от середины. Куда поставить зеркальную точку?","choices":["Слева в 2 клетках","Справа в 2 клетках и на той же высоте","Справа в 4 клетках"],"answer":1,"feedback":["Это не отражение, а то же место.","Тогда точки совпадут при сгибе.","Расстояния будут разными."]},{"prompt":"Какая пара будет симметричной относительно вертикальной оси?","choices":["Одинаковые листочки на одной высоте и равном расстоянии слева и справа","Один лист возле оси, второй у края","Верхний угол слева и нижний угол справа"],"answer":0,"feedback":["Это отражение.","Равного расстояния нет.","Они на разных высотах."]},{"prompt":"Как нарочно нарушить симметрию уже ровного узора?","choices":["Добавить по одинаковой точке с обеих сторон на равном расстоянии","Отразить обе половинки вместе","Добавить звёздочку только справа"],"answer":2,"feedback":["Симметрия сохранится.","Узор останется симметричным.","Слева у неё не будет пары."]},{"prompt":"Новый рисунок: по одному одинаковому кругу с двух сторон оси; правый выше левого. Симметрия есть?","choices":["Да, потому что круги с разных сторон","Нет, совпадает расстояние, но не высота","Да, потому что оба круга одинакового цвета"],"answer":1,"feedback":["Важно ещё точное отражение.","При сгибе круги не наложатся.","Цвет не заменяет положение."]}],"pass":3,"practical":"Нарисуй слева половину узора, справа повтори её как в зеркале."},{"id":"art-09","title":"Объём, рельеф и игрушка","goal":"Различать объёмную форму, плоский рисунок и рельеф на примерах.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 30, 134, 143","intro":"Плоский рисунок не выступает над листом. Рельеф выступает на основе. Объёмную вещь можно рассмотреть с разных сторон.","steps":[{"prompt":"Что из трёх примеров — рельеф?","choices":["Сова, нарисованная фломастером на листе","Бумажный шарик без подложки","Приподнятые бумажные перья, приклеенные на картон"],"answer":2,"feedback":["Это плоский рисунок.","Это отдельная объёмная форма.","Детали выступают над основой."]},{"prompt":"Что лучше всего показывает объём?","choices":["Картонная фигурка, которая стоит и имеет спинку","Овал, нарисованный карандашом","Пёрышко, приклеенное на лист и выступающее над ним"],"answer":0,"feedback":["Её можно рассмотреть со всех сторон.","Это изображение на плоскости.","Это ближе к рельефу."]},{"prompt":"Как в безопасной бумажной работе сделать заметный рельеф травы над листом?","choices":["Нарисовать траву на экране","Только раскрасить траву зелёным","Приклеить сложенную бумажную полоску одной стороной"],"answer":2,"feedback":["Это изображение, не настоящий рельеф.","Поверхность останется плоской.","Свободная часть приподнимется."]},{"prompt":"Ух делает выставку. Куда поставить игрушку, у которой есть спинка, низ и бока?","choices":["К рельефам","К объёмным работам","К плоским рисункам"],"answer":1,"feedback":["Она не прикреплена к основанию как рельеф.","Игрушку можно обойти и рассмотреть со всех сторон.","Она отличается от изображения на листе."]}],"pass":3,"practical":"Сложи бумагу так, чтобы один элемент приподнялся. Найди, где появилась тень, и покажи результат взрослому."},{"id":"art-10","title":"Иллюстрация для короткой истории","goal":"Подбирать композицию и цвет под ключевой момент и объяснять свой выбор.","source":"Соколова, Сенько. «Изобразительное искусство». 2 класс, 2019. с. 97, 152, 169","intro":"Топа построил бумажный домик. Ветер едва не унёс его, но Ух успела придержать крышу. Как картинкой рассказать историю?","steps":[{"prompt":"Какой момент наиболее выразительно показывает помощь Ух?","choices":["Ух придерживает крышу, а рядом видно, как дует ветер","Пустой стол перед постройкой","Только крыша без героев и ветра"],"answer":0,"feedback":["Главное действие понятно.","Помощь ещё не произошла.","Зрителю труднее узнать действие."]},{"prompt":"Как показать сильный ветер на неподвижной картинке?","choices":["Добавить только рамку другого цвета","Наклонить лёгкие детали, добавить линии движения и листья","Поместить листья ровными рядами без наклона"],"answer":1,"feedback":["Она не объяснит ветер.","Они подскажут направление.","Движения не будет видно."]},{"prompt":"Как сделать жест Ух главным в композиции?","choices":["Показать крыло на переднем плане рядом с крышей, а фон сделать спокойным","Расположить слишком много одинаковых домиков по всему листу","Нарисовать Ух едва заметной за большим столом"],"answer":0,"feedback":["Действие выделится.","Взгляд будет рассеиваться.","Жест будет спрятан."]},{"prompt":"«На морозе Топа заметил тёплый свет окна и поспешил домой». Что усилит настроение иллюстрации?","choices":["Тёплым сделать весь снег и всё небо одного цвета","Оставить синие тени на снегу и выделить окно тёплым жёлтым","Нарисовать только снег без окна"],"answer":1,"feedback":["Исчезнет противопоставление улицы и дома.","Цвет рассказывает о тепле дома.","Потеряется ключевой момент."]}],"pass":3,"practical":"Нарисуй маленькую сцену из придуманной истории. Выбери цвет, который подскажет настроение героя."},{"id":"art-12","title":"От тени к свету","goal":"Различать светлый и тёмный оттенок; использовать тёплую или холодную гамму для выбранного настроения.","intro":"Закрепление: представь композицию по описанию и в
