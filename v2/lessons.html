<style>

h1,h2,p{margin:0}h1{font-size:clamp(34px,5.6vw,80px);line-height:1.1;letter-spacing:-.02em}h2{font-size:clamp(27px,3.7vw,49px);line-height:1.14;letter-spacing:-.012em}.hero{padding:clamp(22px,4vw,60px);border-radius:30px;background:var(--lilac);margin-bottom:24px}.hero p{margin-top:13px;line-height:1.55;max-width:68ch}.routeB{background:#fff;border:1px solid var(--line);border-radius:100px;padding:9px 14px}.crumbs{display:flex;margin:0 0 21px;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(226px,1fr));gap:14px}.courseCard,.lessonCard{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;min-height:99px;box-shadow:0 3px 0 #e5e4f2;display:flex;align-items:flex-start;justify-content:space-between;flex-direction:column;gap:8px}.courseCard:hover,.lessonCard:hover,.routeB:hover{border-color:#8d6dc0}.courseCard strong,.lessonCard strong{font-size:20px}.cardNote{font-size:14px;color:var(--muted)}.courseCard:nth-child(3n+1){background:#f1ebfc}.courseCard:nth-child(3n+2){background:#ecfaf4}.courseCard:nth-child(3n){background:#f9f5e4}
.lessonPage{max-width:960px;margin:auto}.bar{display:flex;gap:7px;margin:18px 0}.bar span{background:#dedfec;height:6px;flex:1;border-radius:99px}.bar span.done{background:#24856f}.bar span.now{background:#9173d9}.paper{background:white;border:1px solid var(--line);border-radius:26px;padding:clamp(18px,4vw,43px);margin:13px 0}.paper legend{font-weight:800;font-size:24px;line-height:1.42;white-space:pre-wrap;padding:0 0 11px}.paper fieldset{border:0;margin:0;padding:0;min-width:0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:8px 0 13px}.choice{min-height:66px;text-align:left;background:#f5f1fc;border:1px solid #ddd2ed;border-radius:14px;padding:10px 14px;line-height:1.3;overflow-wrap:anywhere}.choice:not(:disabled):hover{border-color:#7e4da8}.choice.wrong{background:var(--warn);border-color:#d9aa51}.choice.right{background:var(--green);border-color:#35a687}.choice:disabled{cursor:default;color:var(--ink);opacity:1}
.comment{background:#f9f9fe;border-radius:14px;padding:12px 14px;min-height:57px;line-height:1.4}.comment:empty::after{content:"";display:block;height:2px}.toolrow{margin-top:15px;display:flex;flex-wrap:wrap;gap:11px}.primary,.secondary{padding:11px 17px;border-radius:100px;border:1px solid var(--button);font-weight:750}.primary{background:var(--button);color:white}.secondary{background:white}.source{margin:14px 0 0;color:var(--muted);font-size:14px;line-height:1.4}.reading{padding:12px 15px;background:#f4eefc;border-radius:14px;line-height:1.5}.reading p{margin:.65em 0 0;white-space:pre-wrap}.reading summary{font-weight:700;cursor:pointer}.result-pill{display:inline-block;background:var(--lime);padding:8px 13px;border-radius:12px;font-weight:750;margin:15px 0}.introText{white-space:pre-wrap}

<script type="application/json" id="course-data">[{"id":"be","title":"Беларуская мова","lessons":[{"id":"be-01","title":"Літара І і","goal":"Пазнаваць літару і ў знаёмых словах і знаходзіць яе месца ў слове.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 3, 6.","intro":"Ух знайшла ў словах літару і. Спачатку пазнаёмімся з ёй, потым праверым сябе на новых словах.","steps":[{"prompt":"Вялікая літара — І. Якую малую літару трэба паставіць побач?","choices":["л","і","т"],"answer":1,"feedback":["Гэта літара л: у яе дзве ножкі.","Так, І і і — вялікая і малая формы адной літары.","Гэта малая літара т."]},{"prompt":"Дзе стаіць і ў слове «іголка»?","choices":["У пачатку","У сярэдзіне","У канцы"],"answer":0,"feedback":["Так, і — першая літара ў слове.","Паглядзі на першую літару: гэта і.","Апошняя літара — а."]},{"prompt":"Дапоўні слова: л_ст.","choices":["о","а","і"],"answer":2,"feedback":["Тут трэба і: ліст.","Замест а пастаў і: ліст.","Так, атрымалася слова «ліст»."]},{"prompt":"Знайдзі новае слова з літарай і.","choices":["дом","лук","вікно"],"answer":2,"feedback":["У слове «дом» няма і.","У слове «лук» няма і.","Так, у слове «вікно» і стаіць пасля в."]}],"pass":3},{"id":"be-02","title":"Апостраф, г і ч","goal":"Знаходзіць апостраф і адрозніваць напісанні г, гі і ч у пададзеных словах.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 12, 15, 22.","intro":"Апостраф — не літара. Убачым яго ў словах і адрознім напісанні га, гі і ча.","steps":[{"prompt":"Паглядзі: сям’я. Які знак стаіць паміж м і я?","choices":["Мяккі знак","Апостраф","Злучок"],"answer":1,"feedback":["Мяккі знак выглядае так: ь.","Так, ’ — гэта апостраф.","Злучок выглядае як кароткая рыса: -."]},{"prompt":"У якім слове ёсць спалучэнне гі?","choices":["гітара","гара","госць"],"answer":0,"feedback":["Так, слова «гітара» пачынаецца з гі.","У слове «гара» пасля г стаіць а.","У слове «госць» пасля г стаіць о."]},{"prompt":"У якім слове першая літара — ч?","choices":["груша","галка","чай"],"answer":2,"feedback":["«Груша» пачынаецца з літары г.","«Галка» пачынаецца з літары г.","Так, «чай» пачынаецца з ч."]},{"prompt":"Выберы слова «пад’езд» з апострафам на правільным месцы.","choices":["па’дезд","пад’езд","падезд’"],"answer":1,"feedback":["У гэтым слове апостраф патрэбны пасля д, а не перад ім.","Так, апостраф стаіць паміж д і е.","Тут апостраф патрэбны ў сярэдзіне, перад е."]}],"pass":3},{"id":"be-03","title":"Пазнаём гукі па напісанні","goal":"Пазнаваць літары і спалучэнні літар, якія абазначаюць гэтыя гукі ў пададзеных словах.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 33, 39, 46, 53, 59.","intro":"Ух разглядае словы. Будзем знаходзіць асобныя літары і спалучэнні, якія дапамагаюць пазнаць патрэбныя гукі.","steps":[{"prompt":"У слове «воўк» пазнач літару для гуку [ў].","choices":["у","в","ў"],"answer":2,"feedback":["У гэтай пазіцыі напісана ў, а не у.","В — першая літара ў слове; [ў] пазначае іншая літара.","Так, пасля о ў гэтым слове стаіць ў."]},{"prompt":"Дзе ў пачатку слова напісана ц перад е?","choices":["рэчка","цень","сонца"],"answer":1,"feedback":["«Рэчка» пачынаецца з р.","Так, у слове «цень» першымі стаяць ц і е.","У слове «сонца» ц стаіць не ў пачатку і пасля яе — а."]},{"prompt":"У якім слове гук [р] пазначаны першай літарай?","choices":["рак","сіта","кацёл"],"answer":0,"feedback":["Так, «рак» пачынаецца з р.","«Сіта» пачынаецца з с, а р няма.","«Кацёл» пачынаецца з к, а р няма."]},{"prompt":"Дзе пара напісана ў патрэбным парадку: спачатку слова з дз, потым з дж?","choices":["джала, дзед","дзед, дзень","дзед, джала"],"answer":2,"feedback":["Пара мае абодва спалучэнні, але ў адваротным парадку.","Абодва словы пачынаюцца з дз.","Так, «дзед» пачынаецца з дз, «джала» — з дж."]}],"pass":3},{"id":"be-04","title":"Гук, літара, алфавіт і імя","goal":"Адрозніваць гук і літару, упарадкаваць словы па першай літары і напісаць імя з вялікай літары.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 63, 69, 74.","intro":"Гукі мы вымаўляем і чуем, літары бачым і пішам. У алфавіце ў кожнай літары ёсць сваё месца.","steps":[{"prompt":"Што ты бачыш на экране: М?","choices":["Гук","Літару","Склад"],"answer":1,"feedback":["Гук мы чуем, а на экране бачым знак.","Так, М — гэта літара.","Склад мы вымаўляем; тут паказана толькі адна літара."]},{"prompt":"Якая літара ў алфавіце ідзе раней за б і в?","choices":["в","б","а"],"answer":2,"feedback":["В ідзе пасля б.","Б ідзе раней за в, але не раней за б.","Так, пачатак алфавіта: а, б, в."]},{"prompt":"Які запіс імя правільны?","choices":["Алена","алена","АЛена"],"answer":0,"feedback":["Так, першая літара ў імені — вялікая, астатнія малыя.","Імя пачынаецца з вялікай літары.","Тут дастаткова адной вялікай літары ў пачатку."]},{"prompt":"Выберы парадак слоў па алфавіце.","choices":["нос, дом, ліст","дом, ліст, нос","ліст, нос, дом"],"answer":1,"feedback":["Д ідзе раней за л і н.","Так, парадак першых літар: д, л, н.","Пастаў «дом» перад словамі на л і н."]}],"pass":3},{"id":"be-05","title":"Галосныя, зычныя і ў","goal":"Вылучаць галосныя і прымяняць у/ў у простых кантэкстах без знакаў прыпынку.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 81, 86.","intro":"Ух шукае галосныя ў словах. Потым яна параўнае у ў пачатку сказа і ў пасля галоснай без знака прыпынку.","steps":[{"prompt":"У слове «дом» якая літара абазначае галосны гук?","choices":["д","м","о"],"answer":2,"feedback":["Д абазначае зычны гук.","М абазначае зычны гук.","Так, о — галосная літара ў слове «дом»."]},{"prompt":"Падбяры літару: «Мы пайшлі _ лес».","choices":["ў","у","о"],"answer":0,"feedback":["Так, пасля і без знака прыпынку: «пайшлі ў лес».","Перад пропускам галосная і, таму тут патрэбна ў.","Тут выбар паміж у і ў, не о."]},{"prompt":"Сказ пачынаецца з «_ лесе растуць грыбы». Што напішаш?","choices":["Ў","У","О"],"answer":1,"feedback":["У пачатку гэтага сказа пішам У, а не Ў.","Так, «У лесе растуць грыбы».","Тут патрэбны прыназоўнік У."]},{"prompt":"Выберы правільную пару: «_ садзе ціха», «Мы гулялі _ садзе».","choices":["У, ў","Ў, у","У, у"],"answer":0,"feedback":["Так, у пачатку сказа — У, пасля і без паўзы — ў.","У пачатку сказа тут У, а пасля і — ў.","Першы выбар верны; у другім выпадку пасля і патрэбна ў."]}],"pass":3},{"id":"be-06","title":"Склад, перанос і націск","goal":"Вызначаць колькасць складоў, адзначаць націск і выбіраць дапушчальны перанос.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 93, 101, 108.","intro":"У кожным складзе ёсць галосны гук. Паглядзім, колькі складоў у слове і на які з іх падае націск.","steps":[{"prompt":"Колькі складоў у слове «вада»?","choices":["Адзін","Два","Тры"],"answer":1,"feedback":["У слове дзве галосныя. Падзялі: ва-да.","Так, ва-да: два склады.","У слове дзве галосныя, не тры."]},{"prompt":"У слове «груша» якую галосную вымаўляем пад націскам?","choices":["у","а","Абедзве"],"answer":0,"feedback":["Так, націск падае на у: гру́ша.","У слове «гру́ша» а ненаціскная.","У гэтым слове адзін націск, на у."]},{"prompt":"Як можна перанесці слова «ліса» на наступны радок?","choices":["л-іса","ліс-а","лі-са"],"answer":2,"feedback":["Літару л нельга пакідаць адну, і межы складу тут няма.","Адну літару а нельга пераносіць на новы радок.","Так, гэта падзел на склады: лі-са."]},{"prompt":"Колькі складоў і дзе націск у новым слове «малако»?","choices":["Тры, на апошнім","Два, на першым","Тры, на другім"],"answer":0,"feedback":["Так, ма-ла-ко́: тры склады, націск на апошнім.","У слове тры галосныя. Падзялі: ма-ла-ко.","Складоў тры, але націск падае на ко́."]}],"pass":3},{"id":"be-07","title":"О, э і а; е, ё і я","goal":"Параўноўваць словы з розным націскам і падбіраць патрэбную літару ў простых прыкладах.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 1, с. 116, 126.","intro":"Параўноўваем знаёмыя формы аднаго слова. Націск дапамагае заўважыць, што змянілася ў напісанні.","steps":[{"prompt":"Пара: но́гі — н_га́. Якую літару трэба ўставіць?","choices":["о","а","э"],"answer":1,"feedback":["У «но́гі» ёсць о пад націскам, а ў «нага́» пішам а.","Так, правільна «нага́».","Э ў гэтай форме не пішам: нага́."]},{"prompt":"Пара: рэ́кі — р_ка́. Што ўставіш?","choices":["э","о","а"],"answer":2,"feedback":["Э стаіць пад націскам у «рэ́кі», але не ў «рака́».","О не падыходзіць: правільная форма «рака́».","Так, у слове «рака́» першая галосная — а."]},{"prompt":"Пара: лес — л_сы́. Што ўставіш?","choices":["я","е","ё"],"answer":0,"feedback":["Так, «лясы́» пішам з я.","Е пад націскам у «лес», а ў «лясы́» пішам я.","Ё не падыходзіць: «лясы́»."]},{"prompt":"Пара: сё́стры — с_стра́. Устаў патрэбную літару.","choices":["ё","я","е"],"answer":1,"feedback":["Ё стаіць пад націскам у «сё́стры», не ў «сястра́».","Так, правільна «сястра́».","Замест е патрэбна я: «сястра́»."]}],"pass":3},{"id":"be-08","title":"Цвёрдыя і мяккія зычныя; дз і ц","goal":"Бачыць адрозненні ў напісанні, пазнаваць дз і ц у пададзеных парах.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 2, с. 3, 9, 18.","intro":"Параўноўваем словы па іх напісанні. Знойдзем, дзе на пісьме маем дз або ц.","steps":[{"prompt":"Дзе пасля л стаіць і, якая паказвае мяккасць л?","choices":["ліса","лава","лук"],"answer":0,"feedback":["Так, у слове «ліса» пасля л стаіць і.","У «лава» пасля л стаіць а.","У «лук» пасля л стаіць у."]},{"prompt":"Якое слова пачынаецца з дз?","choices":["дом","дуб","дзень"],"answer":2,"feedback":["Пасля д тут ідзе о, няма дз.","Пасля д тут ідзе у, няма дз.","Так, слова «дзень» пачынаецца з дз."]},{"prompt":"У якім слове першай напісана ц?","choices":["том","цень","танец"],"answer":1,"feedback":["Том пачынаецца з т.","Так, «цень» пачынаецца з ц.","У слове «танец» ц апошняя, а першая — т."]},{"prompt":"Дзе ёсць і дз, і ц: у першым і другім слове адпаведна?","choices":["дом, ціхі","дзюба, тэма","дзюба, ціхі"],"answer":2,"feedback":["Другое слова падыходзіць, але «дом» не мае дз.","Першае слова падыходзіць, але «тэма  мова. 2 клас, 2025. Ч. 2, с. 92, 98.","intro":"Прымета дапамагае апісаць прадмет, а дзеянне расказвае, што прадмет ці герой робіць.","steps":[{"prompt":"У сказе «Рыжы кот спіць» якое слова адказвае на пытанне «які?»","choices":["кот","рыжы","спіць"],"answer":1,"feedback":["«Кот» называе жывёлу, адказвае на «хто?».","Так, «рыжы» апісвае ката.","«Спіць» адказвае на «што робіць?»."]},{"prompt":"У сказе «Белы бусел ляціць» якое слова называе дзеянне?","choices":["ляціць","бусел","белы"],"answer":0,"feedback":["Так, бусел што робіць? Ляціць.","«Бусел» — хто, а не што робіць.","«Белы» — прымета птушкі, а не дзеянне."]},{"prompt":"Што можна дадаць як прымету да слова «ліст»?","choices":["ляжыць","дрэва","зялёны"],"answer":2,"feedback":["«Ляжыць» — дзеянне. Патрэбна адказаць «які?».","«Дрэва» называе іншы прадмет.","Так, які ліст? Зялёны."]},{"prompt":"«Маленькі вожык бяжыць». Якія словы называюць спачатку прымету, потым дзеянне?","choices":["вожык, бяжыць","маленькі, бяжыць","бяжыць, маленькі"],"answer":1,"feedback":["«Вожык» называе жывёлу, а не прымету.","Так, «маленькі» адказвае на «які?», «бяжыць» — на «што робіць?».","Абодва словы правільныя, але памяняй іх месцамі."]}],"pass":3},{"id":"be-13","title":"Сказ","goal":"Складаць сказ са слоў, пачынаць яго з вялікай літары і ставіць знак прыпынку ў канцы.","source":"В. І. Свірыдзенка. Беларуская мова. 2 клас, 2025. Ч. 2, с. 105.","intro":"Сказ пачынаецца з вялікай літары. У канцы ставім знак, які адпавядае сэнсу сказа.","steps":[{"prompt":"Які запіс — правільны сказ-паведамленне?","choices":["кот спіць.","Кот спіць","Кот спіць."],"answer":2,"feedback":["У пачатку сказа патрэбна вялікая К.","У канцы сказа-паведамлення тут патрэбна кропка.","Так, вялікая літара ў пачатку і кропка ў канцы."]},{"prompt":"Выберы знак для пытання «Дзе мой сшытак_».","choices":[".","?","!"],"answer":1,"feedback":["Кропка завяршае паведамленне; тут пытанне.","Так, у канцы пытання ставім пытальнік.","Клічнік не паказвае звычайнага пытання."]},{"pr "reading-04","title":"Детство и семья: поступок героя","goal":"Назвать поступок героя и доказать, кому и чем он помог.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 1, с. 58","intro":"Бабушка несла корзину, и яблоко покатилось под скамейку. Лена подняла его и придержала калитку. Бабушка прошла, не выпуская корзину из рук.","steps":[{"prompt":"Что сделала Лена?","choices":["Подняла яблоко и придержала калитку","Поставила корзину на скамейку","Закрыла калитку перед бабушкой"],"answer":0,"feedback":["Так сказано в тексте.","Корзина оставалась у бабушки.","Лена её придержала."]},{"prompt":"Кому Лена помогла?","choices":["Другу","Скамейке","Бабушке"],"answer":2,"feedback":["Друг в рассказе не назван.","Это предмет, а не тот, кому помогли.","Той стало легче пройти с корзиной."]},{"prompt":"Какое предложение показывает результат помощи?","choices":["«Бабушка несла корзину»","«Бабушка прошла, не выпуская корзину из рук»","«Яблоко покатилось под скамейку»"],"answer":1,"feedback":["Это начальная ситуация.","Вот что стало возможно благодаря помощи.","Это было до помощи."]},{"prompt":"Новая сценка: Дима держал лист, пока брат складывал бумажный кораблик. В чём помощь?","choices":["Дима держал лист","Дима помог, потому что поставил кораблик на воду","Дима сложил кораблик один"],"answer":0,"feedback":["Так брату было удобнее складывать кораблик.","Этого не сказано.","Его складывал брат."]}],"pass":3},{"id":"reading-05","title":"Зима: настроение","goal":"Определить настроение описания и указать выражение, которое его передаёт.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 1, с. 109","intro":"Снег лёг на ветки, словно мягкое одеяло. Во дворе было тихо, только хлопья кружились под фонарём.","steps":[{"prompt":"Какое настроение создаёт описание?","choices":["Шумное","Спокойное","Тревожное"],"answer":1,"feedback":["Громких звуков в описании нет.","Во дворе тихо, снег кружится мягко.","В текст .","Это ещё не финал."]},{"prompt":"«Роня забыла варежку. Друг нашёл её под партой и отдал на перемене». Каков порядок?","choices":["Нашёл → забыла → отдал","Отдал → нашёл → забыла","Забыла → друг нашёл → друг отдал"],"answer":2,"feedback":["Сначала варежку забыли.","Вернуть можно только после того, как нашли.","Так идут события в тексте."]}],"pass":3},{"id":"reading-07","title":"Живая природа: факт и предположение","goal":"Отличить, что герой увидел, от того, что он только предположил.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 37","intro":"У пруда Топа заметил круги на воде. «Наверное, прыгнула лягушка», — решил он. Саму лягушку он не увидел.","steps":[{"prompt":"Что Топа действительно увидел?","choices":["Круги на воде","Прыжок лягушки","Двух рыб"],"answer":0,"feedback":["Это прямое наблюдение.","Герой только предположил его.","О рыбах вообще не сказано."]},{"prompt":"Какое слово предупреждает, что герой не уверен?","choices":["Саму","Вода","Наверное"],"answer":2,"feedback":["Слово не передаёт неуверенность.","Это место наблюдения.","Так говорят, когда только предполагают."]},{"prompt":"Можем ли мы по этому тексту точно сказать, кто оставил круги?","choices":["Да, точно рыбка","Нет, причина неизвестна","Да, точно лягушка"],"answer":1,"feedback":["Рыбу герой тоже не увидел.","Наблюдение не доказывает, кто это был.","Герой её не видел."]},{"prompt":"«На снегу видны следы. Может быть, здесь пробежал кот». Что можно утверждать точно?","choices":["На снегу есть следы","Здесь пробежал кот","Следы оставила собака"],"answer":0,"feedback":["Это то, что увидели.","Это лишь догадка.","Для такого вывода данных нет."]}],"pass":3},{"id":"reading-08","title":"Весна: причинная связь","goal":"Объяснить изменение в природе по явной причинной связи в тексте.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 64","intro":"После тёплого дня снег возле стены растаял. Из-под него показалась полоска земли. Топа заметил, что дальний сугроб в тени ещё белый.","steps":[{"prompt":"Почему появилась полоска земли?","choices":["Топа убрал снег","Снег растаял после тепла","Земля побелела"],"answer":1,"feedback":["В тексте он только наблюдал.","Под ним открылась земля.","Она, наоборот, показалась из-под снега."]},{"prompt":"Какое событие здесь причина, а не результат?","choices":["День был тёплым","Топа увидел землю","Показалась земля"],"answer":0,"feedback":["Это причина таяния снега.","Это наблюдение после изменения.","Это результат."]},{"prompt":"Что мы знаем о сугробе в тени?","choices":["Он исчез","Топа его раскрасил","Он ещё белый"],"answer":2,"feedback":["Сказано обратное.","Такой детали нет.","Это наблюдение героя."]},{"prompt":"«Дождь наполнил ямку. После дождя на дорожке была лужа». Что объясняет лужу?","choices":["Лужу принёс герой","В ямку попала дождевая вода","Дорожка сама стала водой"],"answer":1,"feedback":["Героев в сцене нет.","Это причина из текста.","Такого изменения не было."]}],"pass":3},{"id":"reading-09","title":"Юмор: неожиданность","goal":"Определить, какое несоответствие вызвало улыбку.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 74","intro":"Топа принёс на урок рисования большой пакет. «Вот моя модель для натюрморта!» — объявил он и вынул пустую тарелку. «Яблоко было. Но натюрморт проголодался».","steps":[{"prompt":"Что здесь оказалось неожиданным?","choices":["Пакет оказался большим","Был урок рисования","Вместо яблока осталась тарелка"],"answer":2,"feedback":["Это не объясняет шутку.","Это место действия.","Ожидаемый предмет исчез."]},{"prompt":"Кто на самом деле мог проголодаться?","choices":["Пустая тарелка","Топа","Сам рисунок"],"answer":1,"feedback":["Она не может есть.","«натюрморт проголодался» звучит как шутливое оправдание.","Он не может съесть яблоко."]},{"prompt":"Какая фраза заметнее всего подаёт шутку?","choices":["«Натюрморт проголодался»","«Топа принёс пакет»","«Вынул пустую тарелку»"],"answer":0,"feedback":["Неживое будто ведёт себя как живое.","Это подготовка.","Это неожиданное событие, но не шутливое объяснение."]},{"prompt":"«Ух взяла зонтик от дождя. А под зонтиком сидел воробей, будто заказал навес». Что смешит?","choices":["Ух взяла зонтик","Начался дождь","Воробей воспользовался зонтиком как человек с заказом"],"answer":2,"feedback":["Это обычное действие в дождь.","Сам дождь не главная шутка.","Сравнение неожиданное."]}],"pass":3},{"id":"reading-10","title":"Вопросы и ответы по тексту","goal":"Отвечать на вопросы «кто?», «где?», «почему?» и находить текстовую опору.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 102","intro":"На крыльце библиотеки Миша увидел мокрую коробку с книгами. Он позвал библиотекаря, потому что боялся, что намокнут страницы. Вместе они занесли коробку внутрь.","steps":[{"prompt":"Кто первым увидел коробку?","choices":["Миша","Библиотекарь","Книга"],"answer":0,"feedback":["Он назван в первом предложении.","Его Миша позвал позже.","Книга не может заметить коробку."]},{"prompt":"Где стояла коробка?","choices":["Под деревом","На полке","На крыльце библиотеки"],"answer":2,"feedback":["Такого места в рассказе нет.","В рассказе её сначала увидели снаружи.","Место названо прямо."]},{"prompt":"Почему Миша позвал библиотекаря?","choices":["Чтобы открыть окно","Он боялся, что намокнут страницы","Чтобы узнать название книги"],"answer":1,"feedback":["Окно не упоминается.","Это указано после «потому что».","Текст предлагает другую причину."]},{"prompt":"«За клумбой Оля заметила потерянную лейку и вернула её садовнику, чтобы он мог полить цветы». Где Оля нашла лейку?","choices":["За клумбой","У садовника","Ради цветов"],"answer":0,"feedback":["Это ответ на «где?».","Садовнику её вернули позже.","Это отвечает на «зачем?», а не «где?»."]}],"pass":3},{"id":"reading-11","title":"Лето: пересказ по опорам","goal":"В кратком пересказе сохранить место, ключевое событие и результат.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 119","intro":"У пруда друзья запускали бумажные лодки. Ветер прибил лодку Кати к берегу. Друг поднял её палочкой, и они пустили лодку снова.","steps":[{"prompt":"Какая деталь нужна для пересказа начала?","choices":["Друзья ходили по школе","Друзья запускали лодки у пруда","Катя раскрасила лодку"],"answer":1,"feedback":["Это другое место.","Указаны место и занятие.","Цвет и краски не названы."]},{"prompt":"Что изменило ход игры?","choices":["Ветер прибил лодку к берегу","Друзья сразу ушли домой","Друзья пришли к пруду"],"answer":0,"feedback":["Возникла задача, которую надо решить.","Они продолжили игру.","Это было началом."]},{"prompt":"Чем закончилась история?","choices":["Лодка осталась у берега","Пруд пересох","Друзья снова пустили лодку"],"answer":2,"feedback":["Её подняли.","Такого не сказано.","Это результат помощи."]},{"prompt":"«На поляне Саша уронил воздушного змея в куст. Нина осторожно сняла его. Дети продолжили игру». Какой пересказ ничего важного не потерял?","choices":["Нина помогла, потому что наступила ночь","На поляне змей застрял, Нина помогла, и игра продолжилась","Дети были на поляне"],"answer":1,"feedback":["Это не следует из текста.","Есть место, событие и результат.","Потеряны событие и итог."]}],"pass":3},{"id":"reading-12","title":"Итог: герой, причина и заголовок","goal":"Применить навыки понимания к незнакомому мини-рассказу.","source":"В. С. Воропаева, Т. С. Куцанова. «Литературное чтение», 2 класс, ч. 1–2, 2022. Ч. 2, с. 102, 119","intro":"Пока ребята рисовали мелом, рядом с рисунком остановилась божья коровка. Вика увидела, что по дорожке вот-вот пройдёт группа. Она показала детям насекомое, и группа обошла его.","steps":[{"prompt":"Кто нашёл выход из ситуации?","choices":["Божья коровка","Группа","Вика"],"answer":2,"feedback":["Она остановилась рядом, но не договаривалась с детьми.","Она обошла насекомое после по
