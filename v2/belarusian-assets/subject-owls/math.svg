  <title id="ukh-title">Ух с математическими фишками</title>
  <desc id="ukh-desc">Совушка Ух в учебной сцене. Крылья, лицо, лапки, книга и предмет урока отделены для анимации.</desc>
  <style>
@media (prefers-reduced-motion: no-preference){
  .motion-breathe { animation: breathe 4.8s ease-in-out infinite; }
  .motion-blink { transform-box: view-box; animation: blink 5.1s ease-in-out infinite; }
  .motion-wave { transform-box: view-box; animation: wave 4.8s ease-in-out infinite; }
  .motion-crest { transform-box: view-box; animation: tuft 4.8s ease-in-out infinite; }
}
@keyframes breathe {0%,22%,100% {transform:translateY(0)} 12% {transform:translateY(-2px)} }
@keyframes blink {0%,35%,42%,100%{transform:scaleY(1)} 38%,39%{transform:scaleY(.12)}}
@keyframes wave {0%,19%,100%{transform:rotate(0deg)} 5%,13%{transform:rotate(-7deg)} 9%{transform:rotate(3deg)}}
@keyframes tuft {0%,24%,100%{transform:rotate(0deg)} 12%{transform:rotate(6deg)}}
</style>
